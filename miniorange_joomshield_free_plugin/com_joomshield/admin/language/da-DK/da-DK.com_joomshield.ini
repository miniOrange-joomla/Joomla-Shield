COM_JOOMSHIELD_STALE_URL_REWRITE_NOTE="Offentlige sider kan stadig indeholde absolutte adresser fra et tidligere domæne eller en staging-kopi. JoomShield omskriver matchende URL'er i den HTML, der sendes til besøgende. Artikler, menuer og andet gemt indhold ændres ikke. Dette anvendes i PHP på Apache og Nginx. Der kræves ingen ekstra .htaccess- eller Nginx-serverregler."
