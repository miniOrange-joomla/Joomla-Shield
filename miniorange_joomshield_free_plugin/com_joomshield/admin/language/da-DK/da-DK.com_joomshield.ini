COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_NOTE="Beskyt Joomla-administrator-URL'en med en browserprompt til brugernavn og adgangskode. Dette er adskilt fra Joomla-brugerkonti. PHP anvender dette på Apache og Nginx, så snart du gemmer. Ekstra webserverregler nedenfor styrker Apache via .htaccess og skal kopieres ind i Nginx. Kombiner det med tilpasning af webadressen til administratorloginsiden for to beskyttelseslag. Whitelist den besøgendes IP, der vises i pladsholderen for dette felt og i loginrapporterne. Den samme adresse gælder for alle websteder, der åbnes fra dette netværk. Whitelist ikke en privat proxyadresse som 172.31.x.x."
