COM_JOOMSHIELD_DETECTED_SERVER_NGINX="Nginx. PHP-beskyttelse er allerede aktiv. Kopiér det aktuelle udsnit fra fanen Nginx-regler til den Nginx-fil, der anvender serverregler på dette websted, og genindlæs derefter Nginx."
COM_JOOMSHIELD_DETECTED_SERVER_UNKNOWN="Kunne ikke identificeres ud fra denne anmodning. Følg både Apache- og Nginx-trinene for dit hostingmiljø."
COM_JOOMSHIELD_SERVER_RESTRICTION_NOTES_TITLE="Sådan anvendes begrænsningsregler"
COM_JOOMSHIELD_SERVER_RESTRICTION_PHP_NOTE="JoomShield anvender denne beskyttelse i PHP med det samme, efter du gemmer, på Apache og Nginx, også selvom ekstra serverregler ikke skrives."
COM_JOOMSHIELD_SERVER_RESTRICTION_APACHE_NOTE="Aktivér Apache-skriveindstillingen på denne formular. JoomShield skriver derefter automatisk en markeret blok til webstedets .htaccess-fil."
COM_JOOMSHIELD_SERVER_RESTRICTION_NGINX_NOTE="Nginx læser ikke .htaccess. Åbn Nginx-regler, kopiér det aktuelle udsnit, indsæt det i den Nginx-fil, hvorfra serverregler anvendes på dette websted, og genindlæs derefter Nginx."
COM_JOOMSHIELD_SERVER_RESTRICTION_DISABLE_NOTE="Når du deaktiverer denne funktion, opdateres Apache .htaccess-regler automatisk, når Apache-skriveindstillingen er aktiveret. Nginx-regler skal opdateres igen fra fanen Nginx-regler. Ellers bliver de tidligere Nginx-begrænsninger ved med at gælde."
COM_JOOMSHIELD_EMERGENCY_SITE_OFFLINE_APACHE_NOTE="Når Apache-skriveindstillingen er aktiveret, skriver JoomShield en markeret RewriteRule-blok til .htaccess, så Apache returnerer 503 til offentlige besøgende. Administrator-URL'er og whitelisted IP'er forbliver tilladt. Når du deaktiverer denne funktion, fjernes den markerede .htaccess-blok automatisk."
COM_JOOMSHIELD_EMERGENCY_SITE_OFFLINE_NGINX_NOTE="Kopiér reglerne for nødslukning af websted fra fanen Nginx-regler ind i server { }-blokken for dette websted, og genindlæs derefter Nginx. PHP tager stadig webstedet offline, hvis disse Nginx-linjer ikke tilføjes."
COM_JOOMSHIELD_EMERGENCY_SITE_OFFLINE_DISABLE_NOTE="Når du deaktiverer nødslukning af websted, opdateres Apache .htaccess automatisk, når Apache-skriveindstillingen er aktiveret. For Nginx skal du åbne Nginx-regler og erstatte tidligere indsatte JoomShield-linjer med det nye udsnit (eller genindlæse Nginx, hvis du inkluderede den genererede fil). Hvis du lader de gamle Nginx-linjer blive stående, kan webstedet forblive blokeret på serverniveau."
COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_APACHE_NOTE="Når Apache-skriveindstillingen er aktiveret, skriver JoomShield HTTP Basic Auth og videresendelse af Authorization til webstedets .htaccess-fil. Gem først en beskyttelsesadgangskode, så Apache-adgangskodefilen kan oprettes."
COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_NGINX_NOTE="PHP viser stadig prompten på /administrator. For ekstra Nginx-prompt skal du kopiere de udkommenterede auth-linjer fra fanen Nginx-regler ind i din eksisterende administrator-location, så PHP/FastCGI-indstillingerne forbliver uændrede. Videresend også Authorization-headeren: fastcgi_param HTTP_AUTHORIZATION $http_authorization;"
COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_DISABLE_NOTE="Når du deaktiverer beskyttelse af administratoradgang, opdateres Apache .htaccess automatisk, når Apache-skriveindstillingen er aktiveret. For Nginx skal du fjerne eller erstatte de tidligere indsatte JoomShield-auth-linjer fra fanen Nginx-regler og genindlæse Nginx. Ellers kan Nginx blive ved med at bede om den ekstra adgangskode."
COM_JOOMSHIELD_SERVER_RULES_SAVED_NOTE="PHP-beskyttelse er aktiv på Apache og Nginx. Apache / LiteSpeed: ekstra regler blev skrevet til .htaccess, hvis den indstilling er aktiveret. Nginx: åbn fanen Nginx-regler, kopiér det aktuelle udsnit til den Nginx-fil, der anvender serverregler på dette websted, og genindlæs derefter Nginx. Opdater Nginx-regler igen, efter du deaktiverer en begrænsningsfunktion."
COM_JOOMSHIELD_OPEN_NGINX_RULES="Åbn Nginx-regler"
COM_JOOMSHIELD_SERVER_RULES_STATUS_TITLE="Aktuelle begrænsningsindstillinger, der bruges til at opbygge disse Nginx-regler"
COM_JOOMSHIELD_SERVER_RULES_STATUS_ON="Til"
COM_JOOMSHIELD_SERVER_RULES_STATUS_OFF="Fra"
COM_JOOMSHIELD_NGINX_RULES_INTRO="Brug denne side, når webstedet betjenes af Nginx. Apache- og LiteSpeed-websteder behøver ikke denne side; deres ekstra begrænsningsregler skrives automatisk til .htaccess, når den indstilling er aktiveret."
COM_JOOMSHIELD_NGINX_RULES_STEPS_TITLE="Anvend disse Nginx-regler"
COM_JOOMSHIELD_NGINX_RULES_STEP_1="Kopiér udsnittet nedenfor. Det matcher allerede de aktuelle indstillinger for nødslukning af websted og beskyttelse af administratoradgang."
COM_JOOMSHIELD_NGINX_RULES_STEP_2="Indsæt det i server { }-blokken i dette websteds Nginx-konfiguration (ofte /etc/nginx/sites-available/your-site eller Nginx-virtual host i dit hostingpanel)."
COM_JOOMSHIELD_NGINX_RULES_STEP_3="Hvis udsnittet indeholder udkommenterede administrator-auth-linjer, skal du tilføje dem inde i din eksisterende administrator-location, så PHP/FastCGI-indstillingerne forbliver uændrede."
COM_JOOMSHIELD_NGINX_RULES_STEP_4="Test Nginx-konfigurationen, og genindlæs derefter Nginx. Gentag dette, efter du aktiverer eller deaktiverer en begrænsningsfunktion."
COM_JOOMSHIELD_NGINX_RULES_INCLUDE_NOTE="Valgfrit: tilføj include-linjen nedenfor i den samme server { }-blok. JoomShield holder den genererede fil synkroniseret, når du gemmer begrænsningsindstillinger. Du skal stadig genindlæse Nginx efter hver ændring."
COM_JOOMSHIELD_NGINX_RULES_DISABLE_NOTE="Når du deaktiverer nødslukning af websted eller beskyttelse af administratoradgang, skal du erstatte tidligere indsatte JoomShield Nginx-regler med udsnittet på denne side (eller genindlæse Nginx, hvis du inkluderede den genererede fil). Hvis du lader de gamle linjer blive i Nginx-konfigurationen, bliver de serverregler ved med at gælde. PHP-beskyttelse forbliver aktiv under alle omstændigheder."
