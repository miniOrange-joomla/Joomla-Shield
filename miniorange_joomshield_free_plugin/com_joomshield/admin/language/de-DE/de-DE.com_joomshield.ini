COM_JOOMSHIELD_DETECTED_SERVER="Erkannter Webserver für diese Anfrage:"
COM_JOOMSHIELD_DETECTED_SERVER_APACHE="Apache oder LiteSpeed. Aktivieren Sie unten die .htaccess-Option, damit JoomShield die zusätzlichen Serverregeln automatisch schreiben kann."
COM_JOOMSHIELD_DETECTED_SERVER_NGINX="Nginx. Der PHP-Schutz ist bereits aktiv. Kopieren Sie den aktuellen Ausschnitt vom Tab Nginx-Regeln in die Nginx-Datei, die Serverregeln für diese Website anwendet, und laden Sie Nginx anschließend neu."
COM_JOOMSHIELD_DETECTED_SERVER_UNKNOWN="Konnte anhand dieser Anfrage nicht identifiziert werden. Folgen Sie sowohl den Apache- als auch den Nginx-Schritten für Ihre Hosting-Umgebung."
COM_JOOMSHIELD_SERVER_RESTRICTION_NOTES_TITLE="So werden Einschränkungsregeln angewendet"
COM_JOOMSHIELD_SERVER_RESTRICTION_PHP_NOTE="JoomShield wendet diesen Schutz in PHP unmittelbar nach dem Speichern auf Apache und Nginx an, auch wenn keine zusätzlichen Serverregeln geschrieben werden."
COM_JOOMSHIELD_SERVER_RESTRICTION_APACHE_NOTE="Aktivieren Sie auf diesem Formular die Apache-Schreiboption. JoomShield schreibt dann automatisch einen markierten Block in die .htaccess-Datei der Website."
COM_JOOMSHIELD_SERVER_RESTRICTION_NGINX_NOTE="Nginx liest .htaccess nicht. Öffnen Sie Nginx-Regeln, kopieren Sie den aktuellen Ausschnitt, fügen Sie ihn in die Nginx-Datei ein, aus der Serverregeln für diese Website angewendet werden, und laden Sie Nginx anschließend neu."
COM_JOOMSHIELD_SERVER_RESTRICTION_DISABLE_NOTE="Nachdem Sie diese Funktion deaktivieren, werden Apache-.htaccess-Regeln automatisch aktualisiert, wenn die Apache-Schreiboption aktiviert ist. Nginx-Regeln müssen erneut über den Tab Nginx-Regeln aktualisiert werden. Andernfalls gelten die vorherigen Nginx-Einschränkungen weiter."
COM_JOOMSHIELD_EMERGENCY_SITE_OFFLINE_APACHE_NOTE="Wenn die Apache-Schreiboption aktiviert ist, schreibt JoomShield einen markierten RewriteRule-Block in .htaccess, damit Apache für öffentliche Besucher 503 zurückgibt. Administrator-URLs und Whitelist-IPs bleiben erlaubt. Wenn Sie diese Funktion deaktivieren, wird dieser markierte .htaccess-Block automatisch entfernt."
COM_JOOMSHIELD_EMERGENCY_SITE_OFFLINE_NGINX_NOTE="Kopieren Sie die Regeln für Notfall: Website offline vom Tab Nginx-Regeln in den Block server { } dieser Website und laden Sie Nginx anschließend neu. PHP nimmt die Website trotzdem offline, wenn diese Nginx-Zeilen nicht hinzugefügt werden."
COM_JOOMSHIELD_EMERGENCY_SITE_OFFLINE_DISABLE_NOTE="Nachdem Sie Notfall: Website offline deaktivieren, wird Apache .htaccess automatisch aktualisiert, wenn die Apache-Schreiboption aktiviert ist. Für Nginx öffnen Sie Nginx-Regeln und ersetzen zuvor eingefügte JoomShield-Zeilen durch den neuen Ausschnitt (oder laden Sie Nginx neu, wenn Sie die generierte Datei eingebunden haben). Wenn die alten Nginx-Zeilen stehen bleiben, kann die Website auf Serverebene blockiert bleiben."
COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_APACHE_NOTE="Wenn die Apache-Schreiboption aktiviert ist, schreibt JoomShield HTTP Basic Auth und die Weiterleitung von Authorization in die .htaccess-Datei der Website. Speichern Sie zuerst ein Schutzkennwort, damit die Apache-Kennwortdatei erstellt werden kann."
COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_NGINX_NOTE="PHP fordert weiterhin unter /administrator zur Eingabe auf. Für eine zusätzliche Nginx-Abfrage kopieren Sie die auskommentierten Auth-Zeilen vom Tab Nginx-Regeln in Ihre vorhandene Administrator-location, damit die PHP/FastCGI-Einstellungen unverändert bleiben. Leiten Sie außerdem den Authorization-Header weiter: fastcgi_param HTTP_AUTHORIZATION $http_authorization;"
COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_DISABLE_NOTE="Nachdem Sie den Administratorzugriffsschutz deaktivieren, wird Apache .htaccess automatisch aktualisiert, wenn die Apache-Schreiboption aktiviert ist. Für Nginx entfernen oder ersetzen Sie die zuvor eingefügten JoomShield-Auth-Zeilen vom Tab Nginx-Regeln und laden Sie Nginx neu. Andernfalls kann Nginx weiterhin nach dem zusätzlichen Kennwort fragen."
COM_JOOMSHIELD_SERVER_RULES_SAVED_NOTE="Der PHP-Schutz ist auf Apache und Nginx aktiv. Apache / LiteSpeed: zusätzliche Regeln wurden in .htaccess geschrieben, wenn diese Option aktiviert ist. Nginx: öffnen Sie den Tab Nginx-Regeln, kopieren Sie den aktuellen Ausschnitt in die Nginx-Datei, die Serverregeln für diese Website anwendet, und laden Sie Nginx anschließend neu. Aktualisieren Sie Nginx-Regeln erneut, nachdem Sie eine Einschränkungsfunktion deaktiviert haben."
COM_JOOMSHIELD_OPEN_NGINX_RULES="Nginx-Regeln öffnen"
COM_JOOMSHIELD_SERVER_RULES_STATUS_TITLE="Aktuelle Einschränkungseinstellungen, die zum Erstellen dieser Nginx-Regeln verwendet werden"
COM_JOOMSHIELD_SERVER_RULES_STATUS_ON="Ein"
COM_JOOMSHIELD_SERVER_RULES_STATUS_OFF="Aus"
COM_JOOMSHIELD_NGINX_RULES_INTRO="Verwenden Sie diese Seite, wenn die Website von Nginx bereitgestellt wird. Apache- und LiteSpeed-Websites benötigen diese Seite nicht; ihre zusätzlichen Einschränkungsregeln werden automatisch in .htaccess geschrieben, wenn diese Option aktiviert ist."
COM_JOOMSHIELD_NGINX_RULES_STEPS_TITLE="Diese Nginx-Regeln anwenden"
COM_JOOMSHIELD_NGINX_RULES_STEP_1="Kopieren Sie den Ausschnitt unten. Er entspricht bereits den aktuellen Einstellungen für Notfall: Website offline und Administratorzugriffsschutz."
COM_JOOMSHIELD_NGINX_RULES_STEP_2="Fügen Sie ihn in den Block server { } der Nginx-Konfiguration dieser Website ein (häufig /etc/nginx/sites-available/your-site oder der Nginx-Virtual-Host in Ihrem Hosting-Panel)."
COM_JOOMSHIELD_NGINX_RULES_STEP_3="Wenn der Ausschnitt auskommentierte Administrator-Auth-Zeilen enthält, fügen Sie diese in Ihre vorhandene Administrator-location ein, damit die PHP/FastCGI-Einstellungen unverändert bleiben."
COM_JOOMSHIELD_NGINX_RULES_STEP_4="Testen Sie die Nginx-Konfiguration und laden Sie Nginx anschließend neu. Wiederholen Sie dies, nachdem Sie eine Einschränkungsfunktion aktiviert oder deaktiviert haben."
COM_JOOMSHIELD_NGINX_RULES_INCLUDE_NOTE="Optional: fügen Sie die include-Zeile unten im selben Block server { } hinzu. JoomShield hält diese generierte Datei synchron, wenn Sie Einschränkungseinstellungen speichern. Sie müssen Nginx nach jeder Änderung weiterhin neu laden."
COM_JOOMSHIELD_NGINX_RULES_DISABLE_NOTE="Nachdem Sie Notfall: Website offline oder den Administratorzugriffsschutz deaktivieren, ersetzen Sie zuvor eingefügte JoomShield-Nginx-Regeln durch den Ausschnitt auf dieser Seite (oder laden Sie Nginx neu, wenn Sie die generierte Datei eingebunden haben). Wenn die alten Zeilen in der Nginx-Konfiguration stehen bleiben, gelten diese Serverregeln weiter. Der PHP-Schutz bleibt in jedem Fall aktiv."
COM_JOOMSHIELD_NGINX_SNIPPET="Nginx-Konfigurationsausschnitt"
COM_JOOMSHIELD_NGINX_SNIPPET_NOTE="Dieser Ausschnitt entspricht den aktuellen JoomShield-Einschränkungseinstellungen. Fügen Sie ihn in die Nginx-Datei ein, die Serverregeln für diese Website anwendet, und laden Sie Nginx anschließend neu."
COM_JOOMSHIELD_NGINX_SNIPPET_DOWNLOAD="Nginx-Ausschnitt herunterladen"
