COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_NOTE="Schützen Sie die Joomla-Administrator-URL mit einer Browser-Aufforderung für Benutzername und Passwort. Dies ist unabhängig von Joomla-Benutzerkonten. PHP wendet dies auf Apache und Nginx an, sobald Sie speichern. Zusätzliche Webserver-Regeln unten verstärken Apache über .htaccess und müssen in Nginx kopiert werden. Kombinieren Sie es mit der Anpassung der Admin-Anmeldeseiten-URL für zwei Schutzebenen. Setzen Sie die Besucher-IP auf die Whitelist, die im Platzhalter dieses Feldes und in den Anmeldeberichten angezeigt wird. Dieselbe Adresse gilt für jede Website, die aus diesem Netzwerk geöffnet wird. Setzen Sie keine private Proxy-Adresse wie 172.31.x.x auf die Whitelist."
