COM_JOOMSHIELD_STALE_URL_REWRITE="Veraltete Website-URLs korrigieren"
COM_JOOMSHIELD_STALE_URL_REWRITE_NOTE="Öffentliche Seiten können noch absolute Adressen einer früheren Domain oder Staging-Kopie enthalten. JoomShield schreibt übereinstimmende URLs im HTML um, das an Besucher gesendet wird. Beiträge, Menüs und andere gespeicherte Inhalte werden nicht geändert. Dies wird in PHP auf Apache und Nginx angewendet. Es sind keine zusätzlichen .htaccess- oder Nginx-Serverregeln erforderlich."
