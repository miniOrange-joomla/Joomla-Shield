COM_JOOMSHIELD_STALE_URL_REWRITE="Διόρθωση παρωχημένων διευθύνσεων URL ιστοτόπου"
COM_JOOMSHIELD_STALE_URL_REWRITE_NOTE="Οι δημόσιες σελίδες μπορεί να περιέχουν ακόμη απόλυτες διευθύνσεις από προηγούμενο τομέα ή αντίγραφο δοκιμής. Το JoomShield ξαναγράφει τις αντίστοιχες διευθύνσεις URL στο HTML που αποστέλλεται στους επισκέπτες. Τα άρθρα, τα μενού και άλλο αποθηκευμένο περιεχόμενο δεν αλλάζουν. Αυτό εφαρμόζεται σε PHP σε Apache και Nginx. Δεν απαιτούνται επιπλέον κανόνες διακομιστή .htaccess ή Nginx."
COM_JOOMSHIELD_STALE_URL_REWRITE_ENABLE="Διόρθωση παρωχημένων διευθύνσεων URL σε δημόσιες σελίδες"
COM_JOOMSHIELD_STALE_URL_REWRITE_HOSTS="Προηγούμενες διευθύνσεις ιστοτόπου"
COM_JOOMSHIELD_STALE_URL_REWRITE_HOSTS_TIP="Μία διεύθυνση ανά γραμμή. Χρησιμοποιήστε μόνο τον κεντρικό υπολογιστή, ή κεντρικό υπολογιστή και φάκελο εάν ο προηγούμενος ιστότοπος χρησιμοποιούσε υποκατάλογο. Μην συμπεριλάβετε http, https ή τελική κάθετο."
COM_JOOMSHIELD_STALE_URL_REWRITE_CURRENT="Η δημόσια διεύθυνση αυτού του ιστοτόπου"
COM_JOOMSHIELD_STALE_URL_REWRITE_SAVED="Οι ρυθμίσεις διόρθωσης παρωχημένων διευθύνσεων URL αποθηκεύτηκαν."
COM_JOOMSHIELD_STALE_URL_REWRITE_EMPTY="Προσθέστε τουλάχιστον μία έγκυρη προηγούμενη διεύθυνση ιστοτόπου πριν ενεργοποιήσετε αυτή την προστασία."
COM_JOOMSHIELD_WRITE_APACHE_RULES="Apache / LiteSpeed: εγγραφή επίσης αυτών των κανόνων περιορισμού στο αρχείο .htaccess του ιστοτόπου αυτόματα. Το Nginx αγνοεί το .htaccess. Η προστασία PHP παραμένει ενεργή εάν δεν είναι δυνατή η εγγραφή του αρχείου."
COM_JOOMSHIELD_WRITE_APACHE_RULES_STATUS="Εγγραφή κανόνων Apache .htaccess"
COM_JOOMSHIELD_APACHE_SERVER="Apache / LiteSpeed"
COM_JOOMSHIELD_NGINX_SERVER="Nginx"
COM_JOOMSHIELD_PHP_PROTECTION="PHP (κάθε διακομιστής)"
COM_JOOMSHIELD_DETECTED_SERVER="Ανιχνευμένος διακομιστής ιστού για αυτό το αίτημα:"
COM_JOOMSHIELD_DETECTED_SERVER_APACHE="Apache ή LiteSpeed. Ενεργοποιήστε την επιλογή .htaccess παρακάτω ώστε το JoomShield να μπορεί να γράψει αυτόματα τους επιπλέον κανόνες διακομιστή."
COM_JOOMSHIELD_DETECTED_SERVER_NGINX="Nginx. Η προστασία PHP είναι ήδη ενεργή. Αντιγράψτε το τρέχον απόσπασμα από την καρτέλα Κανόνες Nginx στο αρχείο Nginx που εφαρμόζει κανόνες διακομιστή σε αυτόν τον ιστότοπο και, στη συνέχεια, φορτώστε ξανά το Nginx."
COM_JOOMSHIELD_DETECTED_SERVER_UNKNOWN="Δεν ήταν δυνατή η αναγνώριση από αυτό το αίτημα. Ακολουθήστε τα βήματα τόσο για Apache όσο και για Nginx για το περιβάλλον φιλοξενίας σας."
COM_JOOMSHIELD_SERVER_RESTRICTION_NOTES_TITLE="Πώς εφαρμόζονται οι κανόνες περιορισμού"
COM_JOOMSHIELD_SERVER_RESTRICTION_PHP_NOTE="Το JoomShield εφαρμόζει αυτή την προστασία σε PHP αμέσως μετά την αποθήκευση, σε Apache και Nginx, ακόμη και αν δεν εγγραφούν επιπλέον κανόνες διακομιστή."
COM_JOOMSHIELD_SERVER_RESTRICTION_APACHE_NOTE="Ενεργοποιήστε την επιλογή εγγραφής Apache σε αυτή τη φόρμα. Το JoomShield γράφει τότε αυτόματα ένα επισημασμένο μπλοκ στο αρχείο .htaccess του ιστοτόπου."
COM_JOOMSHIELD_SERVER_RESTRICTION_NGINX_NOTE="Το Nginx δεν διαβάζει το .htaccess. Ανοίξτε τους Κανόνες Nginx, αντιγράψτε το τρέχον απόσπασμα, επικολλήστε το στο αρχείο Nginx από το οποίο εφαρμόζονται κανόνες διακομιστή σε αυτόν τον ιστότοπο και φορτώστε ξανά το Nginx."
COM_JOOMSHIELD_SERVER_RESTRICTION_DISABLE_NOTE="Αφού απενεργοποιήσετε αυτή τη λειτουργία, οι κανόνες Apache .htaccess ενημερώνονται αυτόματα όταν είναι ενεργή η επιλογή εγγραφής Apache. Οι κανόνες Nginx πρέπει να ενημερωθούν ξανά από την καρτέλα Κανόνες Nginx. Διαφορετικά εξακολουθούν να ισχύουν οι προηγούμενοι περιορισμοί Nginx."
COM_JOOMSHIELD_EMERGENCY_SITE_OFFLINE_APACHE_NOTE="Όταν είναι ενεργή η επιλογή εγγραφής Apache, το JoomShield γράφει ένα επισημασμένο μπλοκ RewriteRule στο .htaccess ώστε ο Apache να επιστρέφει 503 για δημόσιους επισκέπτες. Οι διευθύνσεις URL διαχειριστή και οι διευθύνσεις IP στη λίστα επιτρεπόμενων παραμένουν επιτρεπτές. Όταν απενεργοποιήσετε αυτή τη λειτουργία, αυτό το επισημασμένο μπλοκ .htaccess αφαιρείται αυτόματα."
COM_JOOMSHIELD_EMERGENCY_SITE_OFFLINE_NGINX_NOTE="Αντιγράψτε τους κανόνες επείγουσας αποσύνδεσης ιστοτόπου από την καρτέλα Κανόνες Nginx στο μπλοκ server { } αυτού του ιστοτόπου και φορτώστε ξανά το Nginx. Η PHP θέτει τον ιστότοπο εκτός λειτουργίας ακόμη και αν αυτές οι γραμμές Nginx δεν προστεθούν."
COM_JOOMSHIELD_EMERGENCY_SITE_OFFLINE_DISABLE_NOTE="Αφού απενεργοποιήσετε την επείγουσα αποσύνδεση ιστοτόπου, το Apache .htaccess ενημερώνεται αυτόματα όταν είναι ενεργή η επιλογή εγγραφής Apache. Για Nginx, ανοίξτε τους Κανόνες Nginx και αντικαταστήστε τυχόν προηγούμενες επικολλημένες γραμμές JoomShield με το νέο απόσπασμα (ή φορτώστε ξανά το Nginx εάν συμπεριλάβατε το παραγόμενο αρχείο). Αν αφήσετε τις παλιές γραμμές Nginx, ο ιστότοπος μπορεί να παραμείνει αποκλεισμένος στον διακομιστή."
COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_APACHE_NOTE="Όταν είναι ενεργή η επιλογή εγγραφής Apache, το JoomShield γράφει HTTP Basic Auth και προώθηση Authorization στο αρχείο .htaccess του ιστοτόπου. Αποθηκεύστε πρώτα έναν κωδικό προστασίας ώστε να μπορεί να δημιουργηθεί το αρχείο κωδικών Apache."
COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_NGINX_NOTE="Η PHP εξακολουθεί να εμφανίζει προτροπή στο /administrator. Για επιπλέον προτροπή Nginx, αντιγράψτε τις σχολιασμένες γραμμές auth από την καρτέλα Κανόνες Nginx στην υπάρχουσα τοποθεσία διαχειριστή ώστε οι ρυθμίσεις PHP/FastCGI να παραμείνουν αμετάβλητες. Προωθήστε επίσης την κεφαλίδα Authorization: fastcgi_param HTTP_AUTHORIZATION $http_authorization;"
COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_DISABLE_NOTE="Αφού απενεργοποιήσετε την προστασία πρόσβασης διαχειριστή, το Apache .htaccess ενημερώνεται αυτόματα όταν είναι ενεργή η επιλογή εγγραφής Apache. Για Nginx, αφαιρέστε ή αντικαταστήστε τις προηγούμενες επικολλημένες γραμμές auth του JoomShield από την καρτέλα Κανόνες Nginx και φορτώστε ξανά το Nginx. Διαφορετικά το Nginx μπορεί να συνεχίσει να ζητά τον επιπλέον κωδικό."
COM_JOOMSHIELD_SERVER_RULES_SAVED_NOTE="Η προστασία PHP είναι ενεργή σε Apache και Nginx. Apache / LiteSpeed: επιπλέον κανόνες γράφτηκαν στο .htaccess εάν αυτή η επιλογή είναι ενεργή. Nginx: ανοίξτε την καρτέλα Κανόνες Nginx, αντιγράψτε το τρέχον απόσπασμα στο αρχείο Nginx που εφαρμόζει κανόνες διακομιστή σε αυτόν τον ιστότοπο και φορτώστε ξανά το Nginx. Ενημερώστε ξανά τους κανόνες Nginx αφού απενεργοποιήσετε μια λειτουργία περιορισμού."
COM_JOOMSHIELD_OPEN_NGINX_RULES="Άνοιγμα κανόνων Nginx"
COM_JOOMSHIELD_SERVER_RULES_STATUS_TITLE="Τρέχουσες ρυθμίσεις περιορισμού που χρησιμοποιούνται για τη δημιουργία αυτών των κανόνων Nginx"
COM_JOOMSHIELD_SERVER_RULES_STATUS_ON="Ενεργό"
COM_JOOMSHIELD_SERVER_RULES_STATUS_OFF="Ανενεργό"
COM_JOOMSHIELD_NGINX_RULES_INTRO="Χρησιμοποιήστε αυτή τη σελίδα όταν ο ιστότοπος εξυπηρετείται από Nginx. Οι ιστότοποι Apache και LiteSpeed δεν χρειάζονται αυτή τη σελίδα· οι επιπλέον κανόνες περιορισμού τους γράφονται αυτόματα στο .htaccess όταν αυτή η επιλογή είναι ενεργή."
COM_JOOMSHIELD_NGINX_RULES_STEPS_TITLE="Εφαρμογή αυτών των κανόνων Nginx"
COM_JOOMSHIELD_NGINX_RULES_STEP_1="Αντιγράψτε το απόσπασμα παρακάτω. Ταιριάζει ήδη με τις τρέχουσες ρυθμίσεις επείγουσας αποσύνδεσης ιστοτόπου και προστασίας πρόσβασης διαχειριστή."
COM_JOOMSHIELD_NGINX_RULES_STEP_2="Επικολλήστε το στο μπλοκ server { } της διαμόρφωσης Nginx αυτού του ιστοτόπου (συχνά /etc/nginx/sites-available/your-site ή ο εικονικός κεντρικός υπολογιστής Nginx στον πίνακα φιλοξενίας)."
COM_JOOMSHIELD_NGINX_RULES_STEP_3="Εάν το απόσπασμα περιλαμβάνει σχολιασμένες γραμμές ελέγχου ταυτότητας διαχειριστή, προσθέστε τις μέσα στην υπάρχουσα τοποθεσία διαχειριστή ώστε οι ρυθμίσεις PHP/FastCGI να παραμείνουν αμετάβλητες."
COM_JOOMSHIELD_NGINX_RULES_STEP_4="Δοκιμάστε τη διαμόρφωση Nginx και φορτώστε ξανά το Nginx. Επαναλάβετε το μετά την ενεργοποίηση ή απενεργοποίηση μιας λειτουργίας περιορισμού."
COM_JOOMSHIELD_NGINX_RULES_INCLUDE_NOTE="Προαιρετικά: προσθέστε την παρακάτω γραμμή include στο ίδιο μπλοκ server { }. Το JoomShield διατηρεί αυτό το παραγόμενο αρχείο συγχρονισμένο όταν αποθηκεύετε ρυθμίσεις περιορισμού. Πρέπει να φορτώνετε ξανά το Nginx μετά από κάθε αλλαγή."
COM_JOOMSHIELD_NGINX_RULES_DISABLE_NOTE="Αφού απενεργοποιήσετε την επείγουσα αποσύνδεση ιστοτόπου ή την προστασία πρόσβασης διαχειριστή, αντικαταστήστε τυχόν προηγούμενους επικολλημένους κανόνες Nginx του JoomShield με το απόσπασμα σε αυτή τη σελίδα (ή φορτώστε ξανά το Nginx εάν συμπεριλάβατε το παραγόμενο αρχείο). Αν αφήσετε τις παλιές γραμμές στη διαμόρφωση Nginx, αυτοί οι κανόνες διακομιστή συνεχίζουν να ισχύουν. Η προστασία PHP παραμένει ενεργή είτε έτσι είτε αλλιώς."
COM_JOOMSHIELD_NGINX_SNIPPET="Απόσπασμα διαμόρφωσης Nginx"
COM_JOOMSHIELD_NGINX_SNIPPET_NOTE="Αυτό το απόσπασμα ταιριάζει με τις τρέχουσες ρυθμίσεις περιορισμού του JoomShield. Επικολλήστε το στο αρχείο Nginx που εφαρμόζει κανόνες διακομιστή σε αυτόν τον ιστότοπο και φορτώστε ξανά το Nginx."
COM_JOOMSHIELD_NGINX_SNIPPET_DOWNLOAD="Λήψη αποσπάσματος Nginx"
