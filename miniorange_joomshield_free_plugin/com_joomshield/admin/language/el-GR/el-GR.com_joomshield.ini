COM_JOOMSHIELD_NGINX_GENERATED_PATH="Το JoomShield ενημερώνει αυτό το αρχείο αυτόματα όταν αποθηκεύονται ρυθμίσεις περιορισμού:"
COM_JOOMSHIELD_NGINX_INCLUDE_DIRECTIVE="Προσθέστε αυτή τη γραμμή include μέσα στο μπλοκ server { } του Nginx εάν θέλετε το JoomShield να διατηρεί συγχρονισμένους τους κανόνες που περιλαμβάνονται:"
COM_JOOMSHIELD_COPY_INCLUDE_DIRECTIVE="Αντιγραφή γραμμής include"
