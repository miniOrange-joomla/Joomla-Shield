COM_JOOMSHIELD_EMERGENCY_SITE_OFFLINE_NOTE="Χρησιμοποιήστε το για αντιμετώπιση περιστατικού όταν ο δημόσιος ιστότοπος πρέπει να τεθεί εκτός λειτουργίας αμέσως. Η πρόσβαση διαχειριστή και οι διευθύνσεις IP της λίστας επιτρεπόμενων παραμένουν διαθέσιμες. Η PHP το εφαρμόζει σε Apache και Nginx μόλις αποθηκεύσετε. Οι επιπλέον κανόνες διακομιστή ιστού παρακάτω είναι προαιρετικοί στον Apache και απαιτούνται μόνο αν θέλετε και το Nginx να αποκλείει την κίνηση πριν από την PHP. Πρόκειται για επείγουσα επικάλυψη και δεν αντικαθιστά τη λειτουργία Ιστότοπος εκτός λειτουργίας στην καθολική διαμόρφωση του Joomla για προγραμματισμένη συντήρηση."
