COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION="Προστασία πρόσβασης διαχειριστή"
COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_NOTE="Προστατέψτε τη διεύθυνση URL διαχειριστή του Joomla με προτροπή ονόματος χρήστη και κωδικού πρόσβασης στο πρόγραμμα περιήγησης. Αυτό είναι ξεχωριστό από τους λογαριασμούς χρηστών του Joomla. Η PHP το εφαρμόζει σε Apache και Nginx μόλις αποθηκεύσετε. Οι επιπλέον κανόνες διακομιστή ιστού παρακάτω ενισχύουν τον Apache μέσω .htaccess και πρέπει να αντιγραφούν στο Nginx. Συνδυάστε το με την προσαρμογή της διεύθυνσης URL της σελίδας σύνδεσης διαχειριστή για δύο επίπεδα προστασίας. Προσθέστε στη λίστα επιτρεπόμενων τη διεύθυνση IP επισκέπτη που εμφανίζεται στο κείμενο κράτησης θέσης αυτού του πεδίου και στις αναφορές σύνδεσης. Η ίδια διεύθυνση ισχύει για κάθε ιστότοπο που ανοίγει από αυτό το δίκτυο. Μην προσθέτετε στη λίστα επιτρεπόμενων μια ιδιωτική διεύθυνση διακομιστή μεσολάβησης όπως η 172.31.x.x."
