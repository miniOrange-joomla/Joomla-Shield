COM_JOOMSHIELD_REPAIR_OPTIMIZE_DATABASE="Επιδιόρθωση και βελτιστοποίηση βάσης δεδομένων"
COM_JOOMSHIELD_REPAIR_OPTIMIZE_DATABASE_NOTE="Εκτελέστε επιδιόρθωση MySQL στους κατάλληλους πίνακες και βελτιστοποιήστε όλους τους πίνακες του ιστοτόπου σε παρτίδες. Δημιουργήστε πρώτα αντίγραφο ασφαλείας της βάσης δεδομένων. Οι πίνακες InnoDB παραλείπουν την επιδιόρθωση και η βελτιστοποίηση μπορεί να ανακατασκευάσει και να κλειδώσει προσωρινά τους πίνακες."
COM_JOOMSHIELD_REPAIR_OPTIMIZE_DATABASE_BUTTON="Επιδιόρθωση και βελτιστοποίηση βάσης δεδομένων"
COM_JOOMSHIELD_REPAIR_OPTIMIZE_DATABASE_CONFIRM="Να εκτελεστεί επιδιόρθωση και βελτιστοποίηση σε όλους τους πίνακες βάσης δεδομένων του ιστοτόπου; Δημιουργήστε πρώτα αντίγραφο ασφαλείας."
COM_JOOMSHIELD_REPAIR_OPTIMIZE_DATABASE_DONE="Η επιδιόρθωση και η βελτιστοποίηση της βάσης δεδομένων ολοκληρώθηκαν. Εξετάστε τα αποτελέσματα παρακάτω."
