COM_JOOMSHIELD_SERVER_RESTRICTION_NOTES_TITLE="How restriction rules are applied"
COM_JOOMSHIELD_SERVER_RESTRICTION_PHP_NOTE="JoomShield applies this protection in PHP immediately after you save, on Apache and Nginx, even if extra server rules are not written."
COM_JOOMSHIELD_SERVER_RESTRICTION_APACHE_NOTE="Enable the Apache write option on this form. JoomShield then writes a marked block to the site .htaccess file automatically."
COM_JOOMSHIELD_SERVER_RESTRICTION_NGINX_NOTE="Nginx does not read .htaccess. Open Nginx Rules, copy the current snippet, paste it into the Nginx file from which server rules are applied to this site, then reload Nginx."
COM_JOOMSHIELD_SERVER_RESTRICTION_DISABLE_NOTE="After you disable this feature, Apache .htaccess rules are updated automatically when the Apache write option is enabled. Nginx rules must be updated again from the Nginx Rules tab. Otherwise the previous Nginx restrictions keep applying."
COM_JOOMSHIELD_EMERGENCY_SITE_OFFLINE_APACHE_NOTE="When the Apache write option is enabled, JoomShield writes a marked RewriteRule block to .htaccess so Apache returns 503 for public visitors. Administrator URLs and whitelist IPs stay allowed. When you disable this feature, that marked .htaccess block is removed automatically."
COM_JOOMSHIELD_EMERGENCY_SITE_OFFLINE_NGINX_NOTE="Copy the Emergency Site Offline rules from the Nginx Rules tab into the server { } block of this site, then reload Nginx. PHP still takes the site offline if those Nginx lines are not added."
COM_JOOMSHIELD_EMERGENCY_SITE_OFFLINE_DISABLE_NOTE="After you disable Emergency Site Offline, Apache .htaccess is updated automatically when the Apache write option is enabled. For Nginx, open Nginx Rules and replace any previously pasted JoomShield lines with the new snippet (or reload Nginx if you included the generated file). If you leave the old Nginx lines in place, the site can stay blocked at the server."
COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_APACHE_NOTE="When the Apache write option is enabled, JoomShield writes HTTP Basic Auth and Authorization forwarding into the site .htaccess file. Save a protection password first so the Apache password file can be created."
COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_NGINX_NOTE="PHP still prompts on /administrator. For extra Nginx prompting, copy the commented auth lines from the Nginx Rules tab into your existing administrator location so PHP/FastCGI settings stay unchanged. Also forward the Authorization header: fastcgi_param HTTP_AUTHORIZATION $http_authorization;"
COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_DISABLE_NOTE="After you disable Administrator Access Protection, Apache .htaccess is updated automatically when the Apache write option is enabled. For Nginx, remove or replace the previously pasted JoomShield auth lines from the Nginx Rules tab and reload Nginx. Otherwise Nginx can keep asking for the extra password."
COM_JOOMSHIELD_SERVER_RULES_SAVED_NOTE="PHP protection is active on Apache and Nginx. Apache / LiteSpeed: extra rules were written to .htaccess if that option is enabled. Nginx: open the Nginx Rules tab, copy the current snippet into the Nginx file that applies server rules to this site, then reload Nginx. After disabling a restriction feature, update Nginx rules again."
