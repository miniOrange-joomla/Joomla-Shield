COM_JOOMSHIELD_SERVER_RESTRICTION_NOTES_TITLE="Cómo se aplican las reglas de restricción"
COM_JOOMSHIELD_SERVER_RESTRICTION_PHP_NOTE="JoomShield aplica esta protección en PHP inmediatamente después de guardar, en Apache y Nginx, incluso si no se escriben reglas extra del servidor."
COM_JOOMSHIELD_SERVER_RESTRICTION_APACHE_NOTE="Active la opción de escritura de Apache en este formulario. JoomShield escribirá entonces automáticamente un bloque marcado en el archivo .htaccess del sitio."
COM_JOOMSHIELD_SERVER_RESTRICTION_NGINX_NOTE="Nginx no lee .htaccess. Abra Reglas de Nginx, copie el fragmento actual, péguelo en el archivo Nginx desde el que se aplican las reglas del servidor a este sitio y recargue Nginx."
COM_JOOMSHIELD_SERVER_RESTRICTION_DISABLE_NOTE="Después de desactivar esta función, las reglas .htaccess de Apache se actualizan automáticamente cuando la opción de escritura de Apache está habilitada. Las reglas de Nginx deben actualizarse de nuevo desde la pestaña Reglas de Nginx. De lo contrario, las restricciones anteriores de Nginx siguen aplicándose."
COM_JOOMSHIELD_EMERGENCY_SITE_OFFLINE_APACHE_NOTE="Cuando la opción de escritura de Apache está habilitada, JoomShield escribe un bloque RewriteRule marcado en .htaccess para que Apache devuelva 503 a los visitantes públicos. Las URL de administrador y las IP de la lista blanca siguen permitidas. Al desactivar esta función, ese bloque .htaccess marcado se elimina automáticamente."
COM_JOOMSHIELD_EMERGENCY_SITE_OFFLINE_NGINX_NOTE="Copie las reglas de sitio fuera de línea de emergencia de la pestaña Reglas de Nginx en el bloque server { } de este sitio y recargue Nginx. PHP sigue dejando el sitio fuera de línea si no se añaden esas líneas de Nginx."
COM_JOOMSHIELD_EMERGENCY_SITE_OFFLINE_DISABLE_NOTE="Después de desactivar el sitio fuera de línea de emergencia, Apache .htaccess se actualiza automáticamente cuando la opción de escritura de Apache está habilitada. En Nginx, abra Reglas de Nginx y reemplace las líneas de JoomShield pegadas anteriormente por el nuevo fragmento (o recargue Nginx si incluyó el archivo generado). Si deja las líneas antiguas de Nginx, el sitio puede seguir bloqueado en el servidor."
COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_APACHE_NOTE="Cuando la opción de escritura de Apache está habilitada, JoomShield escribe HTTP Basic Auth y el reenvío de Authorization en el archivo .htaccess del sitio. Guarde primero una contraseña de protección para que se pueda crear el archivo de contraseñas de Apache."
COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_NGINX_NOTE="PHP sigue mostrando el aviso en /administrator. Para un aviso extra de Nginx, copie las líneas auth comentadas de la pestaña Reglas de Nginx en su location de administrador existente para que la configuración PHP/FastCGI no cambie. Reenvíe también el encabezado Authorization: fastcgi_param HTTP_AUTHORIZATION $http_authorization;"
COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_DISABLE_NOTE="Después de desactivar la protección de acceso de administrador, Apache .htaccess se actualiza automáticamente cuando la opción de escritura de Apache está habilitada. En Nginx, elimine o reemplace las líneas auth de JoomShield pegadas anteriormente desde la pestaña Reglas de Nginx y recargue Nginx. De lo contrario, Nginx puede seguir pidiendo la contraseña extra."
COM_JOOMSHIELD_SERVER_RULES_SAVED_NOTE="La protección PHP está activa en Apache y Nginx. Apache / LiteSpeed: se escribieron reglas extra en .htaccess si esa opción está habilitada. Nginx: abra la pestaña Reglas de Nginx, copie el fragmento actual en el archivo Nginx que aplica las reglas del servidor a este sitio y recargue Nginx. Después de desactivar una función de restricción, actualice de nuevo las reglas de Nginx."
