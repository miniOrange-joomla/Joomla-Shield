COM_JOOMSHIELD_STALE_URL_REWRITE_NOTE="Las páginas públicas aún pueden contener direcciones absolutas de un dominio anterior o de una copia de preproducción. JoomShield reescribe las URL coincidentes en el HTML enviado a los visitantes. Los artículos, menús y demás contenido almacenado no se modifican. Esto se aplica en PHP en Apache y Nginx. No se requieren reglas extra de .htaccess o del servidor Nginx."
