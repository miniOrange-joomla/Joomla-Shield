COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION="Protección de acceso de administrador"
COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_NOTE="Proteja la URL de administrador de Joomla con un aviso del navegador de nombre de usuario y contraseña. Esta protección es independiente de las cuentas de usuario de Joomla. PHP la aplica en Apache y Nginx en cuanto guarda. Las reglas extra del servidor web más abajo refuerzan Apache mediante .htaccess y deben copiarse en Nginx. Combínela con Personalizar la URL de la página de inicio de sesión de administrador para disponer de dos capas de protección. Incluya en la lista blanca la IP del visitante que se muestra en el marcador de posición de este campo y en los informes de inicio de sesión. Esa misma dirección se aplica en todos los sitios abiertos desde esta red. No incluya en la lista blanca una dirección de proxy privado como 172.31.x.x."
