COM_JOOMSHIELD_SERVER_RESTRICTION_NOTES_TITLE="Comment les règles de restriction sont appliquées"
COM_JOOMSHIELD_SERVER_RESTRICTION_PHP_NOTE="JoomShield applique cette protection en PHP immédiatement après l'enregistrement, sur Apache et Nginx, même si des règles serveur supplémentaires ne sont pas écrites."
COM_JOOMSHIELD_SERVER_RESTRICTION_APACHE_NOTE="Activez l'option d'écriture Apache sur ce formulaire. JoomShield écrit alors automatiquement un bloc marqué dans le fichier .htaccess du site."
COM_JOOMSHIELD_SERVER_RESTRICTION_NGINX_NOTE="Nginx ne lit pas .htaccess. Ouvrez Règles Nginx, copiez l'extrait actuel, collez-le dans le fichier Nginx à partir duquel les règles serveur sont appliquées à ce site, puis rechargez Nginx."
COM_JOOMSHIELD_SERVER_RESTRICTION_DISABLE_NOTE="Après avoir désactivé cette fonctionnalité, les règles .htaccess Apache sont mises à jour automatiquement lorsque l'option d'écriture Apache est activée. Les règles Nginx doivent être mises à jour à nouveau depuis l'onglet Règles Nginx. Sinon, les restrictions Nginx précédentes continuent de s'appliquer."
COM_JOOMSHIELD_EMERGENCY_SITE_OFFLINE_APACHE_NOTE="Lorsque l'option d'écriture Apache est activée, JoomShield écrit un bloc RewriteRule marqué dans .htaccess afin qu'Apache renvoie 503 aux visiteurs publics. Les URL d'administration et les IP de la liste blanche restent autorisées. Lorsque vous désactivez cette fonctionnalité, ce bloc .htaccess marqué est supprimé automatiquement."
COM_JOOMSHIELD_EMERGENCY_SITE_OFFLINE_NGINX_NOTE="Copiez les règles de mise hors ligne d'urgence du site depuis l'onglet Règles Nginx dans le bloc server { } de ce site, puis rechargez Nginx. PHP met tout de même le site hors ligne si ces lignes Nginx ne sont pas ajoutées."
COM_JOOMSHIELD_EMERGENCY_SITE_OFFLINE_DISABLE_NOTE="Après avoir désactivé la mise hors ligne d'urgence du site, Apache .htaccess est mis à jour automatiquement lorsque l'option d'écriture Apache est activée. Pour Nginx, ouvrez Règles Nginx et remplacez les lignes JoomShield précédemment collées par le nouvel extrait (ou rechargez Nginx si vous avez inclus le fichier généré). Si vous laissez les anciennes lignes Nginx, le site peut rester bloqué au niveau du serveur."
COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_APACHE_NOTE="Lorsque l'option d'écriture Apache est activée, JoomShield écrit HTTP Basic Auth et le transfert Authorization dans le fichier .htaccess du site. Enregistrez d'abord un mot de passe de protection afin que le fichier de mots de passe Apache puisse être créé."
COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_NGINX_NOTE="PHP affiche toujours l'invite sur /administrator. Pour une invite Nginx supplémentaire, copiez les lignes auth commentées de l'onglet Règles Nginx dans votre location administrateur existante afin que les paramètres PHP/FastCGI restent inchangés. Transférez également l'en-tête Authorization : fastcgi_param HTTP_AUTHORIZATION $http_authorization;"
COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_DISABLE_NOTE="Après avoir désactivé la protection d'accès administrateur, Apache .htaccess est mis à jour automatiquement lorsque l'option d'écriture Apache est activée. Pour Nginx, supprimez ou remplacez les lignes auth JoomShield précédemment collées depuis l'onglet Règles Nginx, puis rechargez Nginx. Sinon, Nginx peut continuer à demander le mot de passe supplémentaire."
COM_JOOMSHIELD_SERVER_RULES_SAVED_NOTE="La protection PHP est active sur Apache et Nginx. Apache / LiteSpeed : des règles supplémentaires ont été écrites dans .htaccess si cette option est activée. Nginx : ouvrez l'onglet Règles Nginx, copiez l'extrait actuel dans le fichier Nginx qui applique les règles serveur à ce site, puis rechargez Nginx. Après avoir désactivé une fonctionnalité de restriction, mettez à jour les règles Nginx à nouveau."
COM_JOOMSHIELD_OPEN_NGINX_RULES="Ouvrir les règles Nginx"
COM_JOOMSHIELD_SERVER_RULES_STATUS_TITLE="Paramètres de restriction actuels utilisés pour créer ces règles Nginx"
