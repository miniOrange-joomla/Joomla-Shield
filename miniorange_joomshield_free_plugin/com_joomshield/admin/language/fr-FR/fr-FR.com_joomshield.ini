COM_JOOMSHIELD_EMERGENCY_SITE_OFFLINE="Mise hors ligne d'urgence du site"
COM_JOOMSHIELD_EMERGENCY_SITE_OFFLINE_NOTE="Utilisez cette option pour la réponse à incident lorsque le site public doit être mis hors ligne immédiatement. L'accès administrateur et les IP de la liste blanche restent disponibles. PHP applique cette protection sur Apache et Nginx dès l'enregistrement. Les règles de serveur web supplémentaires ci-dessous sont facultatives sous Apache et ne sont nécessaires que si vous voulez aussi que Nginx bloque le trafic avant PHP. Il s'agit d'une superposition d'urgence et elle ne remplace pas la mise hors ligne du site de la configuration globale de Joomla pour une maintenance planifiée."
