COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION="Protection d'accès administrateur"
COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_NOTE="Protégez l'URL d'administration Joomla par une invite de navigateur demandant un nom d'utilisateur et un mot de passe. Cette protection est distincte des comptes utilisateurs Joomla. PHP l'applique sur Apache et Nginx dès l'enregistrement. Les règles serveur web supplémentaires ci-dessous renforcent Apache via .htaccess et doivent être copiées dans Nginx. Combinez-la avec la personnalisation de l'URL de la page de connexion administrateur pour deux niveaux de protection. Mettez en liste blanche l'IP du visiteur affichée dans l'espace réservé de ce champ et dans les rapports de connexion. Cette même adresse s'applique à chaque site ouvert depuis ce réseau. Ne mettez pas en liste blanche une adresse de proxy privé telle que 172.31.x.x."
