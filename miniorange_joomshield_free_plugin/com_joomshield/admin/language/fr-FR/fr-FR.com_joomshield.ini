COM_JOOMSHIELD_NGINX_RULES_STEPS_TITLE="Appliquer ces règles Nginx"
COM_JOOMSHIELD_NGINX_RULES_STEP_1="Copiez l'extrait ci-dessous. Il correspond déjà aux paramètres actuels de mise hors ligne d'urgence du site et de protection d'accès administrateur."
COM_JOOMSHIELD_NGINX_RULES_STEP_2="Collez-le dans le bloc server { } de la configuration Nginx de ce site (souvent /etc/nginx/sites-available/your-site, ou l'hôte virtuel Nginx dans votre panneau d'hébergement)."
COM_JOOMSHIELD_NGINX_RULES_STEP_3="Si l'extrait contient des lignes d'authentification administrateur commentées, ajoutez-les dans votre location administrateur existante afin que les paramètres PHP/FastCGI restent inchangés."
COM_JOOMSHIELD_NGINX_RULES_STEP_4="Testez la configuration Nginx, puis rechargez Nginx. Répétez cette opération après avoir activé ou désactivé une fonctionnalité de restriction."
COM_JOOMSHIELD_NGINX_RULES_INCLUDE_NOTE="Facultatif : ajoutez la ligne include ci-dessous dans le même bloc server { }. JoomShield maintient ce fichier généré synchronisé lorsque vous enregistrez les paramètres de restriction. Vous devez toujours recharger Nginx après chaque modification."
COM_JOOMSHIELD_NGINX_RULES_DISABLE_NOTE="Après avoir désactivé la mise hors ligne d'urgence du site ou la protection d'accès administrateur, remplacez les règles Nginx JoomShield précédemment collées par l'extrait de cette page (ou rechargez Nginx si vous avez inclus le fichier généré). Si vous laissez les anciennes lignes dans la configuration Nginx, ces règles serveur continuent de s'appliquer. La protection PHP reste active dans tous les cas."
