COM_JOOMSHIELD_STALE_URL_REWRITE="Corriger les URL obsolètes du site"
COM_JOOMSHIELD_STALE_URL_REWRITE_NOTE="Les pages publiques peuvent encore contenir des adresses absolues d'un précédent domaine ou d'une copie de préproduction. JoomShield réécrit les URL correspondantes dans le HTML envoyé aux visiteurs. Les articles, menus et autres contenus stockés ne sont pas modifiés. Ceci est appliqué en PHP sur Apache et Nginx. Aucune règle serveur .htaccess ou Nginx supplémentaire n'est requise."
