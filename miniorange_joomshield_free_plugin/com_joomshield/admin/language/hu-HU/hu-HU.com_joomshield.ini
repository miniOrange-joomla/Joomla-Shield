COM_JOOMSHIELD_DETECTED_SERVER_NGINX="Nginx. A PHP-védelem már aktív. Másolja az aktuális részletet az Nginx szabályok lapról abba az Nginx-fájlba, amely a kiszolgálói szabályokat alkalmazza erre a webhelyre, majd töltse újra az Nginxet."
COM_JOOMSHIELD_DETECTED_SERVER_UNKNOWN="Ebből a kérésből nem azonosítható. Kövesse az Apache és az Nginx lépéseket a tárhelykörnyezetének megfelelően."
COM_JOOMSHIELD_SERVER_RESTRICTION_NOTES_TITLE="A korlátozó szabályok alkalmazása"
COM_JOOMSHIELD_SERVER_RESTRICTION_PHP_NOTE="A JoomShield ezt a védelmet PHP-ben azonnal alkalmazza mentés után, Apache és Nginx esetén is, akkor is, ha extra kiszolgálói szabályok nem kerülnek kiírásra."
COM_JOOMSHIELD_SERVER_RESTRICTION_APACHE_NOTE="Engedélyezze ezen az űrlapon az Apache írási opciót. A JoomShield ezután automatikusan egy jelölt blokkot ír a webhely .htaccess fájljába."
COM_JOOMSHIELD_SERVER_RESTRICTION_NGINX_NOTE="Az Nginx nem olvassa a .htaccess fájlt. Nyissa meg az Nginx szabályok lapot, másolja az aktuális részletet, illessze be abba az Nginx-fájlba, amelyből a kiszolgálói szabályok erre a webhelyre vonatkoznak, majd töltse újra az Nginxet."
COM_JOOMSHIELD_SERVER_RESTRICTION_DISABLE_NOTE="A funkció kikapcsolása után az Apache .htaccess szabályok automatikusan frissülnek, ha az Apache írási opció engedélyezve van. Az Nginx szabályokat az Nginx szabályok lapról újra frissíteni kell. Ellenkező esetben a korábbi Nginx-korlátozások érvényben maradnak."
COM_JOOMSHIELD_EMERGENCY_SITE_OFFLINE_APACHE_NOTE="Ha az Apache írási opció engedélyezve van, a JoomShield egy jelölt RewriteRule blokkot ír a .htaccess fájlba, hogy az Apache 503-at adjon a nyilvános látogatóknak. A rendszergazdai URL-ek és a fehérlistás IP-címek engedélyezettek maradnak. A funkció kikapcsolásakor ez a jelölt .htaccess blokk automatikusan eltávolításra kerül."
COM_JOOMSHIELD_EMERGENCY_SITE_OFFLINE_NGINX_NOTE="Másolja a vészhelyzeti webhelyleállítás szabályait az Nginx szabályok lapról ennek a webhelynek a server { } blokkjába, majd töltse újra az Nginxet. A PHP akkor is offline állapotba helyezi a webhelyet, ha ezek az Nginx-sorok nincsenek hozzáadva."
COM_JOOMSHIELD_EMERGENCY_SITE_OFFLINE_DISABLE_NOTE="A vészhelyzeti webhelyleállítás kikapcsolása után az Apache .htaccess automatikusan frissül, ha az Apache írási opció engedélyezve van. Nginx esetén nyissa meg az Nginx szabályok lapot, és cserélje le a korábban beillesztett JoomShield sorokat az új részletre (vagy töltse újra az Nginxet, ha a generált fájlt include-olta). Ha a régi Nginx-sorok a helyükön maradnak, a webhely a kiszolgálón blokkolva maradhat."
COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_APACHE_NOTE="Ha az Apache írási opció engedélyezve van, a JoomShield HTTP Basic Auth-ot és Authorization továbbítást ír a webhely .htaccess fájljába. Először mentse a védelmi jelszót, hogy az Apache jelszófájl létrehozható legyen."
COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_NGINX_NOTE="A PHP továbbra is rákérdez a /administrator címen. Extra Nginx-kérdéshez másolja a kikommentelt auth sorokat az Nginx szabályok lapról a meglévő administrator location blokkba, hogy a PHP/FastCGI beállítások változatlanok maradjanak. Továbbítsa az Authorization fejlécet is: fastcgi_param HTTP_AUTHORIZATION $http_authorization;"
COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_DISABLE_NOTE="A rendszergazdai hozzáférésvédelem kikapcsolása után az Apache .htaccess automatikusan frissül, ha az Apache írási opció engedélyezve van. Nginx esetén távolítsa el vagy cserélje le a korábban beillesztett JoomShield auth sorokat az Nginx szabályok lapról, majd töltse újra az Nginxet. Ellenkező esetben az Nginx továbbra is kérheti az extra jelszót."
COM_JOOMSHIELD_SERVER_RULES_SAVED_NOTE="A PHP-védelem aktív Apache és Nginx esetén. Apache / LiteSpeed: extra szabályok íródtak a .htaccess fájlba, ha az opció engedélyezve van. Nginx: nyissa meg az Nginx szabályok lapot, másolja az aktuális részletet abba az Nginx-fájlba, amely a kiszolgálói szabályokat alkalmazza erre a webhelyre, majd töltse újra az Nginxet. Korlátozó funkció kikapcsolása után frissítse újra az Nginx szabályokat."
COM_JOOMSHIELD_OPEN_NGINX_RULES="Nginx szabályok megnyitása"
COM_JOOMSHIELD_SERVER_RULES_STATUS_TITLE="Ezeknek az Nginx szabályoknak az összeállításához használt aktuális korlátozási beállítások"
COM_JOOMSHIELD_SERVER_RULES_STATUS_ON="Be"
COM_JOOMSHIELD_SERVER_RULES_STATUS_OFF="Ki"
COM_JOOMSHIELD_NGINX_RULES_INTRO="Akkor használja ezt az oldalt, ha a webhelyet Nginx szolgálja ki. Az Apache és LiteSpeed webhelyeknek nincs szükségük erre az oldalra; extra korlátozó szabályaik automatikusan a .htaccess fájlba íródnak, ha az opció engedélyezve van."
COM_JOOMSHIELD_NGINX_RULES_STEPS_TITLE="Ezeknek az Nginx szabályoknak az alkalmazása"
COM_JOOMSHIELD_NGINX_RULES_STEP_1="Másolja az alábbi részletet. Már megegyezik a vészhelyzeti webhelyleállítás és a rendszergazdai hozzáférésvédelem aktuális beállításaival."
COM_JOOMSHIELD_NGINX_RULES_STEP_2="Illessze be a webhely Nginx-konfigurációjának server { } blokkjába (gyakran /etc/nginx/sites-available/your-site, vagy a tárhelypanel Nginx virtuális hosztja)."
COM_JOOMSHIELD_NGINX_RULES_STEP_3="Ha a részlet kikommentelt rendszergazdai hitelesítési sorokat tartalmaz, adja hozzá azokat a meglévő administrator location blokkba, hogy a PHP/FastCGI beállítások változatlanok maradjanak."
COM_JOOMSHIELD_NGINX_RULES_STEP_4="Tesztelje az Nginx-konfigurációt, majd töltse újra az Nginxet. Ismételje meg ezt egy korlátozó funkció be- vagy kikapcsolása után."
COM_JOOMSHIELD_NGINX_RULES_INCLUDE_NOTE="Opcionális: adja hozzá az alábbi include sort ugyanabba a server { } blokkba. A JoomShield szinkronban tartja ezt a generált fájlt, amikor korlátozási beállításokat ment. Minden módosítás után továbbra is újra kell töltenie az Nginxet."
COM_JOOMSHIELD_NGINX_RULES_DISABLE_NOTE="A vészhelyzeti webhelyleállítás vagy a rendszergazdai hozzáférésvédelem kikapcsolása után cserélje le a korábban beillesztett JoomShield Nginx szabályokat az ezen az oldalon lévő részletre (vagy töltse újra az Nginxet, ha a generált fájlt include-olta). Ha a régi sorok az Nginx-konfigurációban maradnak, azok a kiszolgálói szabályok érvényben maradnak. A PHP-védelem mindkét esetben aktív marad."
COM_JOOMSHIELD_NGINX_SNIPPET="Nginx konfigurációs részlet"
COM_JOOMSHIELD_NGINX_SNIPPET_NOTE="Ez a részlet megegyezik a JoomShield aktuális korlátozási beállításaival. Illessze be abba az Nginx-fájlba, amely a kiszolgálói szabályokat alkalmazza erre a webhelyre, majd töltse újra az Nginxet."
