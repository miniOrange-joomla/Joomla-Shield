COM_JOOMSHIELD_EMERGENCY_SITE_OFFLINE_NOTE="Usare questa opzione per la risposta agli incidenti quando il sito pubblico deve essere messo offline immediatamente. L'accesso amministratore e gli IP in whitelist restano disponibili. PHP applica questa protezione su Apache e Nginx non appena si salva. Le regole aggiuntive del server web riportate sotto sono facoltative su Apache e sono necessarie solo se si vuole che anche Nginx blocchi il traffico prima di PHP. Si tratta di una sovrapposizione di emergenza e non sostituisce la modalità Sito offline della configurazione globale di Joomla per la manutenzione pianificata."
