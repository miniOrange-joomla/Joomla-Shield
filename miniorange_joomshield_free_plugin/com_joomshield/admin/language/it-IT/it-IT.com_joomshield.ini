COM_JOOMSHIELD_NGINX_RULES_STEPS_TITLE="Applicare queste regole Nginx"
COM_JOOMSHIELD_NGINX_RULES_STEP_1="Copiare lo snippet seguente. Corrisponde già alle impostazioni correnti di sito offline di emergenza e protezione dell'accesso amministratore."
COM_JOOMSHIELD_NGINX_RULES_STEP_2="Incollarlo nel blocco server { } della configurazione Nginx di questo sito (spesso /etc/nginx/sites-available/your-site, oppure l'host virtuale Nginx nel pannello di hosting)."
COM_JOOMSHIELD_NGINX_RULES_STEP_3="Se lo snippet include righe di autenticazione amministratore commentate, aggiungerle all'interno della location administrator esistente in modo che le impostazioni PHP/FastCGI restino invariate."
COM_JOOMSHIELD_NGINX_RULES_STEP_4="Testare la configurazione Nginx, quindi ricaricare Nginx. Ripetere dopo aver abilitato o disabilitato una funzione di restrizione."
