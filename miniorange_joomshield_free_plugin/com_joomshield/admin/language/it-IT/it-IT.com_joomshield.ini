COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION="Protezione dell'accesso amministratore"
COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_NOTE="Proteggere l'URL dell'amministratore Joomla con una richiesta del browser di nome utente e password. Questa protezione è distinta dagli account utente Joomla. PHP la applica su Apache e Nginx non appena si salva. Le regole extra del server web sotto rafforzano Apache tramite .htaccess e devono essere copiate in Nginx. Combinarla con Personalizza URL della pagina di accesso dell'amministratore per due livelli di protezione. Inserire nella whitelist l'IP del visitatore mostrato nel segnaposto di questo campo e nei report di accesso. Lo stesso indirizzo vale per ogni sito aperto da questa rete. Non inserire nella whitelist un indirizzo proxy privato come 172.31.x.x."
