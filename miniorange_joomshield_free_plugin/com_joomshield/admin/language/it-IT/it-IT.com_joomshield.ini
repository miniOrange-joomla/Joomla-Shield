COM_JOOMSHIELD_STALE_URL_REWRITE="Correggi URL del sito obsoleti"
COM_JOOMSHIELD_STALE_URL_REWRITE_NOTE="Le pagine pubbliche possono ancora contenere indirizzi assoluti di un dominio precedente o di una copia di staging. JoomShield riscrive gli URL corrispondenti nell'HTML inviato ai visitatori. Articoli, menu e altri contenuti memorizzati non vengono modificati. Questa funzione viene applicata in PHP su Apache e Nginx. Non sono richieste regole server .htaccess o Nginx aggiuntive."
