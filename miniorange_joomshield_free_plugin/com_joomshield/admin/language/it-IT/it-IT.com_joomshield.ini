COM_JOOMSHIELD_SERVER_RESTRICTION_NOTES_TITLE="Come vengono applicate le regole di restrizione"
COM_JOOMSHIELD_SERVER_RESTRICTION_PHP_NOTE="JoomShield applica questa protezione in PHP immediatamente dopo il salvataggio, su Apache e Nginx, anche se le regole server aggiuntive non vengono scritte."
COM_JOOMSHIELD_SERVER_RESTRICTION_APACHE_NOTE="Abilitare l'opzione di scrittura Apache in questo modulo. JoomShield scrive quindi automaticamente un blocco contrassegnato nel file .htaccess del sito."
COM_JOOMSHIELD_SERVER_RESTRICTION_NGINX_NOTE="Nginx non legge .htaccess. Aprire Regole Nginx, copiare lo snippet corrente, incollarlo nel file Nginx da cui vengono applicate le regole del server a questo sito, quindi ricaricare Nginx."
COM_JOOMSHIELD_SERVER_RESTRICTION_DISABLE_NOTE="Dopo aver disabilitato questa funzione, le regole .htaccess di Apache vengono aggiornate automaticamente quando l'opzione di scrittura Apache è abilitata. Le regole Nginx devono essere aggiornate di nuovo dalla scheda Regole Nginx. In caso contrario le precedenti restrizioni Nginx restano applicate."
COM_JOOMSHIELD_EMERGENCY_SITE_OFFLINE_APACHE_NOTE="Quando l'opzione di scrittura Apache è abilitata, JoomShield scrive un blocco RewriteRule contrassegnato in .htaccess in modo che Apache restituisca 503 ai visitatori pubblici. Gli URL di amministrazione e gli IP in whitelist restano consentiti. Quando si disabilita questa funzione, quel blocco .htaccess contrassegnato viene rimosso automaticamente."
COM_JOOMSHIELD_EMERGENCY_SITE_OFFLINE_NGINX_NOTE="Copiare le regole del sito offline di emergenza dalla scheda Regole Nginx nel blocco server { } di questo sito, quindi ricaricare Nginx. PHP mette comunque il sito offline se quelle righe Nginx non vengono aggiunte."
COM_JOOMSHIELD_EMERGENCY_SITE_OFFLINE_DISABLE_NOTE="Dopo aver disabilitato il sito offline di emergenza, Apache .htaccess viene aggiornato automaticamente quando l'opzione di scrittura Apache è abilitata. Per Nginx, aprire Regole Nginx e sostituire le righe JoomShield incollate in precedenza con il nuovo snippet (oppure ricaricare Nginx se è stato incluso il file generato). Se si lasciano le vecchie righe Nginx, il sito può restare bloccato a livello di server."
COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_APACHE_NOTE="Quando l'opzione di scrittura Apache è abilitata, JoomShield scrive HTTP Basic Auth e l'inoltro Authorization nel file .htaccess del sito. Salvare prima una password di protezione in modo che il file password di Apache possa essere creato."
COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_NGINX_NOTE="PHP continua a mostrare la richiesta su /administrator. Per un'ulteriore richiesta Nginx, copiare le righe auth commentate dalla scheda Regole Nginx nella location administrator esistente in modo che le impostazioni PHP/FastCGI restino invariate. Inoltrare anche l'intestazione Authorization: fastcgi_param HTTP_AUTHORIZATION $http_authorization;"
COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_DISABLE_NOTE="Dopo aver disabilitato la protezione dell'accesso amministratore, Apache .htaccess viene aggiornato automaticamente quando l'opzione di scrittura Apache è abilitata. Per Nginx, rimuovere o sostituire le righe auth JoomShield incollate in precedenza dalla scheda Regole Nginx e ricaricare Nginx. In caso contrario Nginx può continuare a chiedere la password aggiuntiva."
COM_JOOMSHIELD_SERVER_RULES_SAVED_NOTE="La protezione PHP è attiva su Apache e Nginx. Apache / LiteSpeed: le regole aggiuntive sono state scritte in .htaccess se l'opzione è abilitata. Nginx: aprire la scheda Regole Nginx, copiare lo snippet corrente nel file Nginx che applica le regole del server a questo sito, quindi ricaricare Nginx. Dopo aver disabilitato una funzione di restrizione, aggiornare di nuovo le regole Nginx."
