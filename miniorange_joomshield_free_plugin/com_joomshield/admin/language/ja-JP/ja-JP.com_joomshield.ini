COM_JOOMSHIELD_SERVER_RESTRICTION_NGINX_NOTE="Nginx は .htaccess を読みません。Nginx ルールを開き、現在のスニペットをコピーして、このサイトにサーバールールを適用する Nginx ファイルに貼り付けてから、Nginx を再読み込みしてください。"
COM_JOOMSHIELD_SERVER_RESTRICTION_DISABLE_NOTE="この機能を無効にした後、Apache 書き込みオプションが有効な場合は Apache の .htaccess ルールが自動更新されます。Nginx ルールは Nginx ルールタブから再度更新する必要があります。更新しないと、以前の Nginx 制限が適用され続けます。"
COM_JOOMSHIELD_EMERGENCY_SITE_OFFLINE_APACHE_NOTE="Apache 書き込みオプションが有効な場合、JoomShield はマーク付きの RewriteRule ブロックを .htaccess に書き込み、公開訪問者に対して Apache が 503 を返すようにします。管理者 URL とホワイトリスト IP は許可されたままです。この機能を無効にすると、そのマーク付き .htaccess ブロックは自動的に削除されます。"
COM_JOOMSHIELD_EMERGENCY_SITE_OFFLINE_NGINX_NOTE="Nginx ルールタブから緊急サイトオフラインのルールをこのサイトの server { } ブロックにコピーし、Nginx を再読み込みしてください。それらの Nginx 行を追加しなくても、PHP はサイトをオフラインにします。"
COM_JOOMSHIELD_EMERGENCY_SITE_OFFLINE_DISABLE_NOTE="緊急サイトオフラインを無効にした後、Apache 書き込みオプションが有効な場合は Apache の .htaccess が自動更新されます。Nginx では Nginx ルールを開き、以前貼り付けた JoomShield の行を新しいスニペットに置き換えてください（生成ファイルを include している場合は Nginx を再読み込み）。古い Nginx 行を残すと、サイトがサーバー側でブロックされたままになることがあります。"
COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_APACHE_NOTE="Apache 書き込みオプションが有効な場合、JoomShield は HTTP Basic Auth と Authorization の転送をサイトの .htaccess ファイルに書き込みます。先に保護パスワードを保存して、Apache のパスワードファイルを作成できるようにしてください。"
COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_NGINX_NOTE="PHP は引き続き /administrator で入力を求めます。追加の Nginx プロンプトには、Nginx ルールタブのコメントアウトされた auth 行を既存の administrator location にコピーし、PHP/FastCGI 設定を変更しないでください。Authorization ヘッダーも転送します: fastcgi_param HTTP_AUTHORIZATION $http_authorization;"
COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_DISABLE_NOTE="管理者アクセス保護を無効にした後、Apache 書き込みオプションが有効な場合は Apache の .htaccess が自動更新されます。Nginx では、Nginx ルールタブから以前貼り付けた JoomShield の auth 行を削除または置き換えて Nginx を再読み込みしてください。そうしないと、Nginx が追加パスワードを求め続けることがあります。"
COM_JOOMSHIELD_SERVER_RULES_SAVED_NOTE="PHP 保護は Apache と Nginx で有効です。Apache / LiteSpeed: そのオプションが有効な場合、追加ルールは .htaccess に書き込まれました。Nginx: Nginx ルールタブを開き、現在のスニペットをこのサイトにサーバールールを適用する Nginx ファイルにコピーしてから Nginx を再読み込みしてください。制限機能を無効にした後は、Nginx ルールを再度更新してください。"
COM_JOOMSHIELD_OPEN_NGINX_RULES="Nginx ルールを開く"
COM_JOOMSHIELD_SERVER_RULES_STATUS_TITLE="これらの Nginx ルールの作成に使用されている現在の制限設定"
COM_JOOMSHIELD_SERVER_RULES_STATUS_ON="オン"
COM_JOOMSHIELD_SERVER_RULES_STATUS_OFF="オフ"
COM_JOOMSHIELD_NGINX_RULES_INTRO="サイトが Nginx で提供されている場合にこのページを使用してください。Apache および LiteSpeed のサイトではこのページは不要です。追加の制限ルールは、そのオプションが有効な場合に .htaccess へ自動書き込みされます。"
COM_JOOMSHIELD_NGINX_RULES_STEPS_TITLE="これらの Nginx ルールを適用"
COM_JOOMSHIELD_NGINX_RULES_STEP_1="下のスニペットをコピーしてください。現在の緊急サイトオフラインおよび管理者アクセス保護の設定に既に一致しています。"
COM_JOOMSHIELD_NGINX_RULES_STEP_2="このサイトの Nginx 設定の server { } ブロックに貼り付けてください（多くの場合 /etc/nginx/sites-available/your-site、またはホスティングパネルの Nginx 仮想ホスト）。"
COM_JOOMSHIELD_NGINX_RULES_STEP_3="スニペットにコメントアウトされた管理者認証行が含まれる場合は、既存の administrator location 内に追加し、PHP/FastCGI 設定を変更しないでください。"
COM_JOOMSHIELD_NGINX_RULES_STEP_4="Nginx の設定をテストしてから Nginx を再読み込みしてください。制限機能を有効または無効にした後も、この手順を繰り返してください。"
COM_JOOMSHIELD_NGINX_RULES_INCLUDE_NOTE="任意: 同じ server { } ブロックに下の include 行を追加してください。制限設定を保存すると、JoomShield がその生成ファイルを同期します。変更のたびに Nginx の再読み込みは必要です。"
COM_JOOMSHIELD_NGINX_RULES_DISABLE_NOTE="緊急サイトオフラインまたは管理者アクセス保護を無効にした後、以前貼り付けた JoomShield の Nginx ルールをこのページのスニペットに置き換えてください（生成ファイルを include している場合は Nginx を再読み込み）。古い行を Nginx 設定に残すと、それらのサーバールールが適用され続けます。PHP 保護はどちらの場合も有効です。"
