COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_DISABLE_NOTE="Nadat u beheerderstoegangsbeveiliging uitschakelt, wordt Apache .htaccess automatisch bijgewerkt als de Apache-schrijfoptie is ingeschakeld. Voor Nginx verwijdert of vervangt u de eerder geplakte JoomShield-authregels van het tabblad Nginx-regels en herlaadt u Nginx. Anders kan Nginx het extra wachtwoord blijven vragen."
