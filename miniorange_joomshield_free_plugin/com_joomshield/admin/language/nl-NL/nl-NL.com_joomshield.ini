COM_JOOMSHIELD_EMERGENCY_SITE_OFFLINE_APACHE_NOTE="Als de Apache-schrijfoptie is ingeschakeld, schrijft JoomShield een gemarkeerd RewriteRule-blok naar .htaccess zodat Apache 503 teruggeeft aan openbare bezoekers. Beheerders-URL's en whitelist-IP's blijven toegestaan. Wanneer u deze functie uitschakelt, wordt dat gemarkeerde .htaccess-blok automatisch verwijderd."
COM_JOOMSHIELD_EMERGENCY_SITE_OFFLINE_NGINX_NOTE="Kopieer de regels voor Noodmodus: site offline van het tabblad Nginx-regels naar het server { }-blok van deze site en herlaad daarna Nginx. PHP zet de site nog steeds offline als die Nginx-regels niet worden toegevoegd."
COM_JOOMSHIELD_EMERGENCY_SITE_OFFLINE_DISABLE_NOTE="Nadat u Noodmodus: site offline uitschakelt, wordt Apache .htaccess automatisch bijgewerkt als de Apache-schrijfoptie is ingeschakeld. Voor Nginx opent u Nginx-regels en vervangt u eerder geplakte JoomShield-regels door het nieuwe fragment (of herlaadt u Nginx als u het gegenereerde bestand hebt opgenomen). Als u de oude Nginx-regels laat staan, kan de site op serverniveau geblokkeerd blijven."
COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_APACHE_NOTE="Als de Apache-schrijfoptie is ingeschakeld, schrijft JoomShield HTTP Basic Auth en Authorization-doorsturen naar het .htaccess-bestand van de site. Sla eerst een beschermingswachtwoord op zodat het Apache-wachtwoordbestand kan worden gemaakt."
