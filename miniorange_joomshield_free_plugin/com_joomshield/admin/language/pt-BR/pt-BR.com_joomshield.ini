COM_JOOMSHIELD_SERVER_RESTRICTION_NOTES_TITLE="Como as regras de restrição são aplicadas"
COM_JOOMSHIELD_SERVER_RESTRICTION_PHP_NOTE="O JoomShield aplica esta proteção em PHP imediatamente após salvar, no Apache e no Nginx, mesmo que regras extras do servidor não sejam gravadas."
COM_JOOMSHIELD_SERVER_RESTRICTION_APACHE_NOTE="Ative a opção de gravação do Apache neste formulário. O JoomShield então grava automaticamente um bloco marcado no arquivo .htaccess do site."
COM_JOOMSHIELD_SERVER_RESTRICTION_NGINX_NOTE="O Nginx não lê .htaccess. Abra Regras do Nginx, copie o trecho atual, cole-o no arquivo Nginx a partir do qual as regras do servidor são aplicadas a este site e recarregue o Nginx."
COM_JOOMSHIELD_SERVER_RESTRICTION_DISABLE_NOTE="Depois de desativar este recurso, as regras .htaccess do Apache são atualizadas automaticamente quando a opção de gravação do Apache está ativada. As regras do Nginx devem ser atualizadas novamente na aba Regras do Nginx. Caso contrário, as restrições anteriores do Nginx continuam sendo aplicadas."
COM_JOOMSHIELD_EMERGENCY_SITE_OFFLINE_APACHE_NOTE="Quando a opção de gravação do Apache está ativada, o JoomShield grava um bloco RewriteRule marcado no .htaccess para que o Apache retorne 503 aos visitantes públicos. Os URLs de administrador e os IPs da lista de permissão permanecem permitidos. Ao desativar este recurso, esse bloco .htaccess marcado é removido automaticamente."
COM_JOOMSHIELD_EMERGENCY_SITE_OFFLINE_NGINX_NOTE="Copie as regras de site offline de emergência da aba Regras do Nginx para o bloco server { } deste site e recarregue o Nginx. O PHP ainda coloca o site offline se essas linhas do Nginx não forem adicionadas."
COM_JOOMSHIELD_EMERGENCY_SITE_OFFLINE_DISABLE_NOTE="Depois de desativar o site offline de emergência, o Apache .htaccess é atualizado automaticamente quando a opção de gravação do Apache está ativada. No Nginx, abra Regras do Nginx e substitua as linhas do JoomShield coladas anteriormente pelo novo trecho (ou recarregue o Nginx se você incluiu o arquivo gerado). Se deixar as linhas antigas do Nginx, o site pode permanecer bloqueado no servidor."
COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_APACHE_NOTE="Quando a opção de gravação do Apache está ativada, o JoomShield grava HTTP Basic Auth e o encaminhamento de Authorization no arquivo .htaccess do site. Salve primeiro uma senha de proteção para que o arquivo de senhas do Apache possa ser criado."
COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_NGINX_NOTE="O PHP ainda solicita em /administrator. Para um prompt extra do Nginx, copie as linhas auth comentadas da aba Regras do Nginx para o location de administrador existente, para que as configurações PHP/FastCGI permaneçam inalteradas. Encaminhe também o cabeçalho Authorization: fastcgi_param HTTP_AUTHORIZATION $http_authorization;"
COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_DISABLE_NOTE="Depois de desativar a proteção de acesso do administrador, o Apache .htaccess é atualizado automaticamente quando a opção de gravação do Apache está ativada. No Nginx, remova ou substitua as linhas auth do JoomShield coladas anteriormente na aba Regras do Nginx e recarregue o Nginx. Caso contrário, o Nginx pode continuar pedindo a senha extra."
COM_JOOMSHIELD_SERVER_RULES_SAVED_NOTE="A proteção PHP está ativa no Apache e no Nginx. Apache / LiteSpeed: regras extras foram gravadas no .htaccess se essa opção estiver ativada. Nginx: abra a aba Regras do Nginx, copie o trecho atual para o arquivo Nginx que aplica as regras do servidor a este site e recarregue o Nginx. Após desativar um recurso de restrição, atualize novamente as regras do Nginx."
COM_JOOMSHIELD_OPEN_NGINX_RULES="Abrir regras do Nginx"
COM_JOOMSHIELD_SERVER_RULES_STATUS_TITLE="Configurações de restrição atuais usadas para criar estas regras do Nginx"
