COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION="Proteção de acesso do administrador"
COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_NOTE="Proteja o URL do administrador do Joomla com um prompt do navegador de nome de usuário e senha. Isso é independente das contas de usuário do Joomla. O PHP aplica isso no Apache e no Nginx assim que você salva. As regras extras de servidor web abaixo reforçam o Apache por meio de .htaccess e devem ser copiadas para o Nginx. Combine com Personalizar o URL da página de login do administrador para duas camadas de proteção. Coloque na lista de permissões o IP do visitante mostrado no espaço reservado deste campo e nos relatórios de login. Esse mesmo endereço vale para todos os sites abertos nesta rede. Não coloque na lista de permissões um endereço de proxy privado como 172.31.x.x."
