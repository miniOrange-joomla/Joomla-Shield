COM_JOOMSHIELD_EMERGENCY_SITE_OFFLINE_NOTE="Use esta opção para resposta a incidentes quando o site público precisar ser colocado offline imediatamente. O acesso de administrador e os IPs da lista de permissões permanecem disponíveis. O PHP aplica isso no Apache e no Nginx assim que você salva. As regras extras de servidor web abaixo são opcionais no Apache e necessárias somente se você também quiser que o Nginx bloqueie o tráfego antes do PHP. Esta é uma sobreposição de emergência e não substitui o Site offline da configuração global do Joomla para manutenção planejada."
