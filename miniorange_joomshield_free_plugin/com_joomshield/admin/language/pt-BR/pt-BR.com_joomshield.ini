COM_JOOMSHIELD_STALE_URL_REWRITE="Corrigir URLs desatualizados do site"
COM_JOOMSHIELD_STALE_URL_REWRITE_NOTE="As páginas públicas ainda podem conter endereços absolutos de um domínio anterior ou de uma cópia de homologação. O JoomShield reescreve as URLs correspondentes no HTML enviado aos visitantes. Artigos, menus e outros conteúdos armazenados não são alterados. Isso é aplicado em PHP no Apache e no Nginx. Não são necessárias regras extras de .htaccess ou do servidor Nginx."
