COM_JOOMSHIELD_NGINX_RULES_STEP_1="Copie o trecho abaixo. Ele já corresponde às configurações atuais de site offline de emergência e proteção de acesso do administrador."
COM_JOOMSHIELD_NGINX_RULES_STEP_2="Cole-o no bloco server { } da configuração Nginx deste site (geralmente /etc/nginx/sites-available/your-site, ou o host virtual Nginx no painel de hospedagem)."
