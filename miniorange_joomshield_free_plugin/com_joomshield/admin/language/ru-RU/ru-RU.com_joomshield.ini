COM_JOOMSHIELD_DETECTED_SERVER="Обнаруженный веб-сервер для этого запроса:"
COM_JOOMSHIELD_DETECTED_SERVER_APACHE="Apache или LiteSpeed. Включите ниже параметр .htaccess, чтобы JoomShield мог автоматически записать дополнительные правила сервера."
COM_JOOMSHIELD_DETECTED_SERVER_NGINX="Nginx. Защита PHP уже активна. Скопируйте текущий фрагмент со вкладки «Правила Nginx» в файл Nginx, который применяет правила сервера к этому сайту, затем перезагрузите Nginx."
COM_JOOMSHIELD_DETECTED_SERVER_UNKNOWN="Не удалось определить по этому запросу. Выполните шаги и для Apache, и для Nginx в соответствии с вашей хостинг-средой."
COM_JOOMSHIELD_SERVER_RESTRICTION_NOTES_TITLE="Как применяются правила ограничения"
COM_JOOMSHIELD_SERVER_RESTRICTION_PHP_NOTE="JoomShield применяет эту защиту в PHP сразу после сохранения на Apache и Nginx, даже если дополнительные правила сервера не записаны."
COM_JOOMSHIELD_SERVER_RESTRICTION_APACHE_NOTE="Включите на этой форме параметр записи Apache. JoomShield затем автоматически запишет отмеченный блок в файл .htaccess сайта."
COM_JOOMSHIELD_SERVER_RESTRICTION_NGINX_NOTE="Nginx не читает .htaccess. Откройте «Правила Nginx», скопируйте текущий фрагмент, вставьте его в файл Nginx, из которого к этому сайту применяются правила сервера, затем перезагрузите Nginx."
COM_JOOMSHIELD_SERVER_RESTRICTION_DISABLE_NOTE="После отключения этой функции правила Apache .htaccess обновляются автоматически, если включён параметр записи Apache. Правила Nginx нужно снова обновить на вкладке «Правила Nginx». Иначе прежние ограничения Nginx продолжают действовать."
COM_JOOMSHIELD_EMERGENCY_SITE_OFFLINE_APACHE_NOTE="Если включён параметр записи Apache, JoomShield записывает в .htaccess отмеченный блок RewriteRule, чтобы Apache возвращал 503 публичным посетителям. URL администратора и IP из белого списка остаются разрешёнными. При отключении этой функции отмеченный блок .htaccess удаляется автоматически."
COM_JOOMSHIELD_EMERGENCY_SITE_OFFLINE_NGINX_NOTE="Скопируйте правила аварийного отключения сайта со вкладки «Правила Nginx» в блок server { } этого сайта, затем перезагрузите Nginx. PHP всё равно переводит сайт в офлайн, если эти строки Nginx не добавлены."
COM_JOOMSHIELD_EMERGENCY_SITE_OFFLINE_DISABLE_NOTE="После отключения аварийного отключения сайта Apache .htaccess обновляется автоматически, если включён параметр записи Apache. Для Nginx откройте «Правила Nginx» и замените ранее вставленные строки JoomShield новым фрагментом (или перезагрузите Nginx, если вы подключили сгенерированный файл). Если старые строки Nginx оставить, сайт может остаться заблокированным на уровне сервера."
COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_APACHE_NOTE="Если включён параметр записи Apache, JoomShield записывает HTTP Basic Auth и перенаправление Authorization в файл .htaccess сайта. Сначала сохраните пароль защиты, чтобы можно было создать файл паролей Apache."
COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_NGINX_NOTE="PHP по-прежнему запрашивает данные на /administrator. Для дополнительного запроса Nginx скопируйте закомментированные строки auth со вкладки «Правила Nginx» в существующий location администратора, чтобы настройки PHP/FastCGI не изменились. Также передайте заголовок Authorization: fastcgi_param HTTP_AUTHORIZATION $http_authorization;"
COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_DISABLE_NOTE="После отключения защиты доступа администратора Apache .htaccess обновляется автоматически, если включён параметр записи Apache. Для Nginx удалите или замените ранее вставленные строки auth JoomShield со вкладки «Правила Nginx» и перезагрузите Nginx. Иначе Nginx может продолжать запрашивать дополнительный пароль."
COM_JOOMSHIELD_SERVER_RULES_SAVED_NOTE="Защита PHP активна на Apache и Nginx. Apache / LiteSpeed: дополнительные правила записаны в .htaccess, если этот параметр включён. Nginx: откройте вкладку «Правила Nginx», скопируйте текущий фрагмент в файл Nginx, который применяет правила сервера к этому сайту, затем перезагрузите Nginx. После отключения функции ограничения снова обновите правила Nginx."
COM_JOOMSHIELD_OPEN_NGINX_RULES="Открыть правила Nginx"
COM_JOOMSHIELD_SERVER_RULES_STATUS_TITLE="Текущие настройки ограничения, используемые для создания этих правил Nginx"
COM_JOOMSHIELD_SERVER_RULES_STATUS_ON="Вкл"
COM_JOOMSHIELD_SERVER_RULES_STATUS_OFF="Выкл"
COM_JOOMSHIELD_NGINX_RULES_INTRO="Используйте эту страницу, если сайт обслуживается Nginx. Сайтам Apache и LiteSpeed эта страница не нужна; их дополнительные правила ограничения автоматически записываются в .htaccess, если этот параметр включён."
COM_JOOMSHIELD_NGINX_RULES_STEPS_TITLE="Применить эти правила Nginx"
COM_JOOMSHIELD_NGINX_RULES_STEP_1="Скопируйте фрагмент ниже. Он уже соответствует текущим настройкам аварийного отключения сайта и защиты доступа администратора."
COM_JOOMSHIELD_NGINX_RULES_STEP_2="Вставьте его в блок server { } конфигурации Nginx этого сайта (часто /etc/nginx/sites-available/your-site или виртуальный хост Nginx в панели хостинга)."
COM_JOOMSHIELD_NGINX_RULES_STEP_3="Если фрагмент содержит закомментированные строки аутентификации администратора, добавьте их в существующий location администратора, чтобы настройки PHP/FastCGI не изменились."
COM_JOOMSHIELD_NGINX_RULES_STEP_4="Проверьте конфигурацию Nginx, затем перезагрузите Nginx. Повторите это после включения или отключения функции ограничения."
COM_JOOMSHIELD_NGINX_RULES_INCLUDE_NOTE="Необязательно: добавьте строку include ниже в тот же блок server { }. JoomShield синхронизирует этот сгенерированный файл при сохранении настроек ограничения. После каждого изменения Nginx всё равно нужно перезагрузить."
COM_JOOMSHIELD_NGINX_RULES_DISABLE_NOTE="После отключения аварийного отключения сайта или защиты доступа администратора замените ранее вставленные правила Nginx JoomShield фрагментом на этой странице (или перезагрузите Nginx, если вы подключили сгенерированный файл). Если старые строки оставить в конфигурации Nginx, эти правила сервера продолжают действовать. Защита PHP остаётся активной в любом случае."
COM_JOOMSHIELD_NGINX_SNIPPET="Фрагмент конфигурации Nginx"
COM_JOOMSHIELD_NGINX_SNIPPET_NOTE="Этот фрагмент соответствует текущим настройкам ограничения JoomShield. Вставьте его в файл Nginx, который применяет правила сервера к этому сайту, затем перезагрузите Nginx."
