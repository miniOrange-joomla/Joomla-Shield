COM_JOOMSHIELD_EMERGENCY_SITE_OFFLINE_NOTE="Используйте это при реагировании на инцидент, когда общедоступный сайт необходимо немедленно отключить. Доступ администратора и IP-адреса из белого списка остаются доступны. PHP применяет это на Apache и Nginx сразу после сохранения. Дополнительные правила веб-сервера ниже необязательны для Apache и нужны только если вы также хотите, чтобы Nginx блокировал трафик до PHP. Это аварийный слой и не заменяет отключение сайта в глобальной конфигурации Joomla при плановом обслуживании."
