COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_NOTE="Защитите URL-адрес администратора Joomla запросом имени пользователя и пароля в браузере. Это отдельно от учётных записей пользователей Joomla. PHP применяет это на Apache и Nginx сразу после сохранения. Дополнительные правила веб-сервера ниже усиливают Apache через .htaccess и их нужно скопировать в Nginx. Объедините это с настройкой URL-адреса страницы входа администратора для двух уровней защиты. Добавьте в белый список IP-адрес посетителя, показанный в подсказке этого поля и в отчётах о входе. Этот же адрес действует для каждого сайта, открытого из этой сети. Не добавляйте в белый список частный адрес прокси, например 172.31.x.x."
