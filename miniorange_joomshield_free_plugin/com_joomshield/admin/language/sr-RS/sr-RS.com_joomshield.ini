COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_NOTE="Заштитите Joomla URL администратора упитом прегледача за корисничко име и лозинку. Ово је одвојено од Joomla корисничких налога. PHP ово примењује на Apache и Nginx чим сачувате. Додатна правила веб сервера испод јачају Apache преко .htaccess и морају се копирати у Nginx. Комбинујте са прилагођавањем URL странице за пријаву администратора за два слоја заштите. Ставите на белу листу IP посетиоца приказану у резервисаном тексту овог поља и у извештајима о пријави. Иста адреса важи за сваки сајт отворен са ове мреже. Не стављајте на белу листу приватну proxy адресу као што је 172.31.x.x."
