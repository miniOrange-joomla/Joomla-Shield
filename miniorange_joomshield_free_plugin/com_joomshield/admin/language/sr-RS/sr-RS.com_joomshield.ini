COM_JOOMSHIELD_STALE_URL_REWRITE_NOTE="Јавне странице и даље могу да садрже апсолутне адресе са претходног домена или staging копије. JoomShield преписује одговарајуће URL адресе у HTML-у који се шаље посетиоцима. Чланци, менији и други сачувани садржај се не мењају. Ово се примењује у PHP на Apache и Nginx. Додатна .htaccess или Nginx правила сервера нису потребна."
COM_JOOMSHIELD_STALE_URL_REWRITE_ENABLE="Исправи застареле URL адресе на јавним страницама"
COM_JOOMSHIELD_STALE_URL_REWRITE_HOSTS="Претходне адресе сајта"
COM_JOOMSHIELD_STALE_URL_REWRITE_HOSTS_TIP="Једна адреса по реду. Користите само хост, или хост и фасциклу ако је претходни сајт користио поддиректоријум. Не укључујте http, https нити завршну косу црту."
COM_JOOMSHIELD_STALE_URL_REWRITE_CURRENT="Јавна адреса овог сајта"
COM_JOOMSHIELD_STALE_URL_REWRITE_SAVED="Подешавања исправке застарелих URL адреса су сачувана."
COM_JOOMSHIELD_STALE_URL_REWRITE_EMPTY="Додајте најмање једну важећу претходну адресу сајта пре омогућавања ове заштите."
COM_JOOMSHIELD_WRITE_APACHE_RULES="Apache / LiteSpeed: аутоматски упишите и ова ограничавајућа правила у .htaccess датотеку сајта. Nginx игнорише .htaccess. PHP заштита остаје активна ако датотека не може да се упише."
COM_JOOMSHIELD_WRITE_APACHE_RULES_STATUS="Упиши Apache .htaccess правила"
COM_JOOMSHIELD_APACHE_SERVER="Apache / LiteSpeed"
COM_JOOMSHIELD_NGINX_SERVER="Nginx"
COM_JOOMSHIELD_PHP_PROTECTION="PHP (сваки сервер)"
COM_JOOMSHIELD_DETECTED_SERVER="Откривени веб сервер за овај захтев:"
COM_JOOMSHIELD_DETECTED_SERVER_APACHE="Apache или LiteSpeed. Омогућите .htaccess опцију испод да би JoomShield аутоматски уписао додатна правила сервера."
COM_JOOMSHIELD_DETECTED_SERVER_NGINX="Nginx. PHP заштита је већ активна. Копирајте тренутни исечак са картице Nginx правила у Nginx датотеку која примењује правила сервера на овај сајт, затим поново учитајте Nginx."
COM_JOOMSHIELD_DETECTED_SERVER_UNKNOWN="Није могуће идентификовати из овог захтева. Пратите кораке и за Apache и за Nginx према вашем хостинг окружењу."
COM_JOOMSHIELD_SERVER_RESTRICTION_NOTES_TITLE="Како се примењују ограничавајућа правила"
COM_JOOMSHIELD_SERVER_RESTRICTION_PHP_NOTE="JoomShield примењује ову заштиту у PHP одмах након чувања, на Apache и Nginx, чак и ако додатна правила сервера нису уписана."
COM_JOOMSHIELD_SERVER_RESTRICTION_APACHE_NOTE="Омогућите опцију уписа за Apache на овом обрасцу. JoomShield затим аутоматски уписује означени блок у .htaccess датотеку сајта."
COM_JOOMSHIELD_SERVER_RESTRICTION_NGINX_NOTE="Nginx не чита .htaccess. Отворите Nginx правила, копирајте тренутни исечак, налепите га у Nginx датотеку из које се правила сервера примењују на овај сајт, затим поново учитајте Nginx."
COM_JOOMSHIELD_SERVER_RESTRICTION_DISABLE_NOTE="Након што онемогућите ову функцију, Apache .htaccess правила се аутоматски ажурирају када је опција уписа за Apache омогућена. Nginx правила морају поново да се ажурирају са картице Nginx правила. У супротном претходна Nginx ограничења настављају да се примењују."
COM_JOOMSHIELD_EMERGENCY_SITE_OFFLINE_APACHE_NOTE="Када је опција уписа за Apache омогућена, JoomShield уписује означени RewriteRule блок у .htaccess да би Apache враћао 503 јавним посетиоцима. URL адресе администратора и IP адресе на белој листи остају дозвољене. Када онемогућите ову функцију, тај означени .htaccess блок се аутоматски уклања."
COM_JOOMSHIELD_EMERGENCY_SITE_OFFLINE_NGINX_NOTE="Копирајте правила хитног офлајн сајта са картице Nginx правила у блок server { } овог сајта, затим поново учитајте Nginx. PHP и даље ставља сајт офлајн ако ти Nginx редови нису додати."
COM_JOOMSHIELD_EMERGENCY_SITE_OFFLINE_DISABLE_NOTE="Након што онемогућите хитни офлајн сајт, Apache .htaccess се аутоматски ажурира када је опција уписа за Apache омогућена. За Nginx отворите Nginx правила и замените претходно налепљене JoomShield редове новим исечком (или поново учитајте Nginx ако сте укључили генерисану датотеку). Ако оставите старе Nginx редове, сајт може да остане блокиран на серверу."
COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_APACHE_NOTE="Када је опција уписа за Apache омогућена, JoomShield уписује HTTP Basic Auth и прослеђивање Authorization у .htaccess датотеку сајта. Прво сачувајте лозинку заштите да би се могла креирати Apache датотека лозинки."
COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_NGINX_NOTE="PHP и даље приказује упит на /administrator. За додатни Nginx упит копирајте коментарисане auth редове са картице Nginx правила у постојећи administrator location да би PHP/FastCGI подешавања остала непромењена. Проследите и заглавље Authorization: fastcgi_param HTTP_AUTHORIZATION $http_authorization;"
COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_DISABLE_NOTE="Након што онемогућите заштиту приступа администратору, Apache .htaccess се аутоматски ажурира када је опција уписа за Apache омогућена. За Nginx уклоните или замените претходно налепљене JoomShield auth редове са картице Nginx правила и поново учитајте Nginx. У супротном Nginx може да настави да тражи додатну лозинку."
COM_JOOMSHIELD_SERVER_RULES_SAVED_NOTE="PHP заштита је активна на Apache и Nginx. Apache / LiteSpeed: додатна правила су уписана у .htaccess ако је та опција омогућена. Nginx: отворите картицу Nginx правила, копирајте тренутни исечак у Nginx датотеку која примењује правила сервера на овај сајт, затим поново учитајте Nginx. Након онемогућавања функције ограничења поново ажурирајте Nginx правила."
COM_JOOMSHIELD_OPEN_NGINX_RULES="Отвори Nginx правила"
COM_JOOMSHIELD_SERVER_RULES_STATUS_TITLE="Тренутна подешавања ограничења која се користе за израду ових Nginx правила"
COM_JOOMSHIELD_SERVER_RULES_STATUS_ON="Укључено"
COM_JOOMSHIELD_SERVER_RULES_STATUS_OFF="Искључено"
COM_JOOMSHIELD_NGINX_RULES_INTRO="Користите ову страницу када сајт опслужује Nginx. Сајтовима Apache и LiteSpeed ова страница није потребна; њихова додатна ограничавајућа правила се аутоматски уписују у .htaccess када је та опција омогућена."
COM_JOOMSHIELD_NGINX_RULES_STEPS_TITLE="Примени ова Nginx правила"
COM_JOOMSHIELD_NGINX_RULES_STEP_1="Копирајте исечак испод. Већ одговара тренутним подешавањима хитног офлајн сајта и заштите приступа администратору."
COM_JOOMSHIELD_NGINX_RULES_STEP_2="Налепите га у блок server { } Nginx конфигурације овог сајта (често /etc/nginx/sites-available/your-site или Nginx виртуелни хост у хостинг панелу)."
COM_JOOMSHIELD_NGINX_RULES_STEP_3="Ако исечак садржи коментарисане редове аутентификације администратора, додајте их унутар постојећег administrator location да би PHP/FastCGI подешавања остала непромењена."
COM_JOOMSHIELD_NGINX_RULES_STEP_4="Тестирајте Nginx конфигурацију, затим поново учитајте Nginx. Поновите ово након што омогућите или онемогућите функцију ограничења."
COM_JOOMSHIELD_NGINX_RULES_INCLUDE_NOTE="Опционо: додајте include ред испод у исти блок server { }. JoomShield одржава ту генерисану датотеку усклађеном када сачувате подешавања ограничења. И даље морате поново да учитате Nginx после сваке измене."
COM_JOOMSHIELD_NGINX_RULES_DISABLE_NOTE="Након што онемогућите хитни офлајн сајт или заштиту приступа администратору, замените претходно налепљена JoomShield Nginx правила исечком на овој страници (или поново учитајте Nginx ако сте укључили генерисану датотеку). Ако оставите старе редове у Nginx конфигурацији, та правила сервера настављају да се примењују. PHP заштита остаје активна у сваком случају."
COM_JOOMSHIELD_NGINX_SNIPPET="Nginx исечак конфигурације"
COM_JOOMSHIELD_NGINX_SNIPPET_NOTE="Овај исечак одговара тренутним JoomShield подешавањима ограничења. Налепите га у Nginx датотеку која примењује правила сервера на овај сајт, затим поново учитајте Nginx."
COM_JOOMSHIELD_NGINX_SNIPPET_DOWNLOAD="Преузми Nginx исечак"
