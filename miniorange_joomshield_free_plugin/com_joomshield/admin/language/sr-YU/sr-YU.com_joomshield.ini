COM_JOOMSHIELD_WRITE_APACHE_RULES="Apache / LiteSpeed: automatski upišite i ova ograničavajuća pravila u .htaccess datoteku sajta. Nginx ignoriše .htaccess. PHP zaštita ostaje aktivna ako datoteka ne može da se upiše."
