COM_JOOMSHIELD_DETECTED_SERVER="Otkriveni veb server za ovaj zahtev:"
COM_JOOMSHIELD_DETECTED_SERVER_APACHE="Apache ili LiteSpeed. Omogućite .htaccess opciju ispod da bi JoomShield automatski upisao dodatna pravila servera."
COM_JOOMSHIELD_DETECTED_SERVER_NGINX="Nginx. PHP zaštita je već aktivna. Kopirajte trenutni isečak sa kartice Nginx pravila u Nginx datoteku koja primenjuje pravila servera na ovaj sajt, zatim ponovo učitajte Nginx."
COM_JOOMSHIELD_DETECTED_SERVER_UNKNOWN="Nije moguće identifikovati iz ovog zahteva. Pratite korake i za Apache i za Nginx prema vašem hosting okruženju."
COM_JOOMSHIELD_SERVER_RESTRICTION_NOTES_TITLE="Kako se primenjuju ograničavajuća pravila"
COM_JOOMSHIELD_SERVER_RESTRICTION_PHP_NOTE="JoomShield primenjuje ovu zaštitu u PHP odmah nakon čuvanja, na Apache i Nginx, čak i ako dodatna pravila servera nisu upisana."
COM_JOOMSHIELD_SERVER_RESTRICTION_APACHE_NOTE="Omogućite opciju upisa za Apache na ovom obrascu. JoomShield zatim automatski upisuje označeni blok u .htaccess datoteku sajta."
COM_JOOMSHIELD_SERVER_RESTRICTION_NGINX_NOTE="Nginx ne čita .htaccess. Otvorite Nginx pravila, kopirajte trenutni isečak, nalepite ga u Nginx datoteku iz koje se pravila servera primenjuju na ovaj sajt, zatim ponovo učitajte Nginx."
COM_JOOMSHIELD_SERVER_RESTRICTION_DISABLE_NOTE="Nakon što onemogućite ovu funkciju, Apache .htaccess pravila se automatski ažuriraju kada je opcija upisa za Apache omogućena. Nginx pravila moraju ponovo da se ažuriraju sa kartice Nginx pravila. U suprotnom prethodna Nginx ograničenja nastavljaju da se primenjuju."
COM_JOOMSHIELD_EMERGENCY_SITE_OFFLINE_APACHE_NOTE="Kada je opcija upisa za Apache omogućena, JoomShield upisuje označeni RewriteRule blok u .htaccess da bi Apache vraćao 503 javnim posetiocima. URL adrese administratora i IP adrese na beloj listi ostaju dozvoljene. Kada onemogućite ovu funkciju, taj označeni .htaccess blok se automatski uklanja."
COM_JOOMSHIELD_EMERGENCY_SITE_OFFLINE_NGINX_NOTE="Kopirajte pravila hitnog oflajn sajta sa kartice Nginx pravila u blok server { } ovog sajta, zatim ponovo učitajte Nginx. PHP i dalje stavlja sajt oflajn ako ti Nginx redovi nisu dodati."
COM_JOOMSHIELD_EMERGENCY_SITE_OFFLINE_DISABLE_NOTE="Nakon što onemogućite hitni oflajn sajt, Apache .htaccess se automatski ažurira kada je opcija upisa za Apache omogućena. Za Nginx otvorite Nginx pravila i zamenite prethodno nalepljene JoomShield redove novim isečkom (ili ponovo učitajte Nginx ako ste uključili generisanu datoteku). Ako ostavite stare Nginx redove, sajt može da ostane blokiran na serveru."
COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_APACHE_NOTE="Kada je opcija upisa za Apache omogućena, JoomShield upisuje HTTP Basic Auth i prosleđivanje Authorization u .htaccess datoteku sajta. Prvo sačuvajte lozinku zaštite da bi se mogla kreirati Apache datoteka lozinki."
COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_NGINX_NOTE="PHP i dalje prikazuje upit na /administrator. Za dodatni Nginx upit kopirajte komentarisane auth redove sa kartice Nginx pravila u postojeći administrator location da bi PHP/FastCGI podešavanja ostala nepromenjena. Prosledite i zaglavlje Authorization: fastcgi_param HTTP_AUTHORIZATION $http_authorization;"
COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_DISABLE_NOTE="Nakon što onemogućite zaštitu pristupa administratoru, Apache .htaccess se automatski ažurira kada je opcija upisa za Apache omogućena. Za Nginx uklonite ili zamenite prethodno nalepljene JoomShield auth redove sa kartice Nginx pravila i ponovo učitajte Nginx. U suprotnom Nginx može da nastavi da traži dodatnu lozinku."
COM_JOOMSHIELD_SERVER_RULES_SAVED_NOTE="PHP zaštita je aktivna na Apache i Nginx. Apache / LiteSpeed: dodatna pravila su upisana u .htaccess ako je ta opcija omogućena. Nginx: otvorite karticu Nginx pravila, kopirajte trenutni isečak u Nginx datoteku koja primenjuje pravila servera na ovaj sajt, zatim ponovo učitajte Nginx. Nakon onemogućavanja funkcije ograničenja ponovo ažurirajte Nginx pravila."
COM_JOOMSHIELD_OPEN_NGINX_RULES="Otvori Nginx pravila"
COM_JOOMSHIELD_SERVER_RULES_STATUS_TITLE="Trenutna podešavanja ograničenja koja se koriste za izradu ovih Nginx pravila"
COM_JOOMSHIELD_SERVER_RULES_STATUS_ON="Uključeno"
COM_JOOMSHIELD_SERVER_RULES_STATUS_OFF="Isključeno"
COM_JOOMSHIELD_NGINX_RULES_INTRO="Koristite ovu stranicu kada sajt opslužuje Nginx. Sajtvima Apache i LiteSpeed ova stranica nije potrebna; njihova dodatna ograničavajuća pravila se automatski upisuju u .htaccess kada je ta opcija omogućena."
COM_JOOMSHIELD_NGINX_RULES_STEPS_TITLE="Primeni ova Nginx pravila"
COM_JOOMSHIELD_NGINX_RULES_STEP_1="Kopirajte isečak ispod. Već odgovara trenutnim podešavanjima hitnog oflajn sajta i zaštite pristupa administratoru."
