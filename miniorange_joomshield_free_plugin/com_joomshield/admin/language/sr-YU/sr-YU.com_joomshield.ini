COM_JOOMSHIELD_STALE_URL_REWRITE="Ispravi zastarele URL adrese sajta"
COM_JOOMSHIELD_STALE_URL_REWRITE_NOTE="Javne stranice i dalje mogu da sadrže apsolutne adrese sa prethodnog domena ili staging kopije. JoomShield prepisuje odgovarajuće URL adrese u HTML-u koji se šalje posetiocima. Članci, meniji i drugi sačuvani sadržaj se ne menjaju. Ovo se primenjuje u PHP na Apache i Nginx. Dodatna .htaccess ili Nginx pravila servera nisu potrebna."
