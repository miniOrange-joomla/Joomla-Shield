COM_JOOMSHIELD_DETECTED_SERVER_APACHE="Apache eller LiteSpeed. Aktivera .htaccess-alternativet nedan så att JoomShield automatiskt kan skriva de extra serverreglerna."
COM_JOOMSHIELD_DETECTED_SERVER_NGINX="Nginx. PHP-skyddet är redan aktivt. Kopiera det aktuella utdraget från fliken Nginx-regler till den Nginx-fil som tillämpar serverregler på den här webbplatsen och ladda sedan om Nginx."
COM_JOOMSHIELD_DETECTED_SERVER_UNKNOWN="Kunde inte identifieras från den här begäran. Följ både Apache- och Nginx-stegen för din hostingmiljö."
COM_JOOMSHIELD_SERVER_RESTRICTION_NOTES_TITLE="Hur begränsningsregler tillämpas"
COM_JOOMSHIELD_SERVER_RESTRICTION_PHP_NOTE="JoomShield tillämpar detta skydd i PHP omedelbart efter att du sparar, på Apache och Nginx, även om extra serverregler inte skrivs."
COM_JOOMSHIELD_SERVER_RESTRICTION_APACHE_NOTE="Aktivera Apache-skrivalternativet på det här formuläret. JoomShield skriver sedan automatiskt ett markerat block till webbplatsens .htaccess-fil."
COM_JOOMSHIELD_SERVER_RESTRICTION_NGINX_NOTE="Nginx läser inte .htaccess. Öppna Nginx-regler, kopiera det aktuella utdraget, klistra in det i den Nginx-fil från vilken serverregler tillämpas på den här webbplatsen och ladda sedan om Nginx."
COM_JOOMSHIELD_SERVER_RESTRICTION_DISABLE_NOTE="När du inaktiverar den här funktionen uppdateras Apache .htaccess-regler automatiskt när Apache-skrivalternativet är aktiverat. Nginx-regler måste uppdateras igen från fliken Nginx-regler. Annars fortsätter de tidigare Nginx-begränsningarna att gälla."
COM_JOOMSHIELD_EMERGENCY_SITE_OFFLINE_APACHE_NOTE="När Apache-skrivalternativet är aktiverat skriver JoomShield ett markerat RewriteRule-block till .htaccess så att Apache returnerar 503 för offentliga besökare. Administratörs-URL:er och vitlistade IP-adresser förblir tillåtna. När du inaktiverar den här funktionen tas det markerade .htaccess-blocket bort automatiskt."
COM_JOOMSHIELD_EMERGENCY_SITE_OFFLINE_NGINX_NOTE="Kopiera reglerna för nödoffline för webbplatsen från fliken Nginx-regler till blocket server { } för den här webbplatsen och ladda sedan om Nginx. PHP tar fortfarande webbplatsen offline om de Nginx-raderna inte läggs till."
COM_JOOMSHIELD_EMERGENCY_SITE_OFFLINE_DISABLE_NOTE="När du inaktiverar nödoffline för webbplatsen uppdateras Apache .htaccess automatiskt när Apache-skrivalternativet är aktiverat. För Nginx öppnar du Nginx-regler och ersätter tidigare inklistrade JoomShield-rader med det nya utdraget (eller laddar om Nginx om du inkluderade den genererade filen). Om du lämnar de gamla Nginx-raderna kan webbplatsen fortsätta vara blockerad på servern."
COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_APACHE_NOTE="När Apache-skrivalternativet är aktiverat skriver JoomShield HTTP Basic Auth och vidarebefordran av Authorization till webbplatsens .htaccess-fil. Spara först ett skyddslösenord så att Apache-lösenordsfilen kan skapas."
COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_NGINX_NOTE="PHP visar fortfarande prompten på /administrator. För extra Nginx-prompt kopierar du de kommenterade auth-raderna från fliken Nginx-regler till din befintliga administrator-location så att PHP/FastCGI-inställningarna förblir oförändrade. Vidarebefordra också Authorization-huvudet: fastcgi_param HTTP_AUTHORIZATION $http_authorization;"
COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_DISABLE_NOTE="När du inaktiverar skydd för administratörsåtkomst uppdateras Apache .htaccess automatiskt när Apache-skrivalternativet är aktiverat. För Nginx tar du bort eller ersätter tidigare inklistrade JoomShield-auth-rader från fliken Nginx-regler och laddar om Nginx. Annars kan Nginx fortsätta att be om det extra lösenordet."
COM_JOOMSHIELD_SERVER_RULES_SAVED_NOTE="PHP-skyddet är aktivt på Apache och Nginx. Apache / LiteSpeed: extra regler skrevs till .htaccess om det alternativet är aktiverat. Nginx: öppna fliken Nginx-regler, kopiera det aktuella utdraget till den Nginx-fil som tillämpar serverregler på den här webbplatsen och ladda sedan om Nginx. Uppdatera Nginx-regler igen efter att du inaktiverat en begränsningsfunktion."
COM_JOOMSHIELD_OPEN_NGINX_RULES="Öppna Nginx-regler"
COM_JOOMSHIELD_SERVER_RULES_STATUS_TITLE="Aktuella begränsningsinställningar som används för att skapa dessa Nginx-regler"
COM_JOOMSHIELD_SERVER_RULES_STATUS_ON="På"
COM_JOOMSHIELD_SERVER_RULES_STATUS_OFF="Av"
COM_JOOMSHIELD_NGINX_RULES_INTRO="Använd den här sidan när webbplatsen serveras av Nginx. Apache- och LiteSpeed-webbplatser behöver inte den här sidan; deras extra begränsningsregler skrivs automatiskt till .htaccess när det alternativet är aktiverat."
COM_JOOMSHIELD_NGINX_RULES_STEPS_TITLE="Tillämpa dessa Nginx-regler"
COM_JOOMSHIELD_NGINX_RULES_STEP_1="Kopiera utdraget nedan. Det matchar redan de aktuella inställningarna för nödoffline för webbplatsen och skydd för administratörsåtkomst."
COM_JOOMSHIELD_NGINX_RULES_STEP_2="Klistra in det i blocket server { } i den här webbplatsens Nginx-konfiguration (ofta /etc/nginx/sites-available/your-site eller Nginx virtual host i din hostingpanel)."
COM_JOOMSHIELD_NGINX_RULES_STEP_3="Om utdraget innehåller kommenterade administratörsautentiseringsrader, lägg till dem i din befintliga administrator-location så att PHP/FastCGI-inställningarna förblir oförändrade."
COM_JOOMSHIELD_NGINX_RULES_STEP_4="Testa Nginx-konfigurationen och ladda sedan om Nginx. Upprepa detta efter att du aktiverat eller inaktiverat en begränsningsfunktion."
COM_JOOMSHIELD_NGINX_RULES_INCLUDE_NOTE="Valfritt: lägg till include-raden nedan i samma server { }-block. JoomShield håller den genererade filen synkroniserad när du sparar begränsningsinställningar. Du måste fortfarande ladda om Nginx efter varje ändring."
COM_JOOMSHIELD_NGINX_RULES_DISABLE_NOTE="När du inaktiverar nödoffline för webbplatsen eller skydd för administratörsåtkomst ersätter du tidigare inklistrade JoomShield Nginx-regler med utdraget på den här sidan (eller laddar om Nginx om du inkluderade den genererade filen). Om du lämnar de gamla raderna i Nginx-konfigurationen fortsätter de serverreglerna att gälla. PHP-skyddet förblir aktivt oavsett."
