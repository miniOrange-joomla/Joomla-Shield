COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_NOTE="Skydda Joomlas administratörs-URL med en webbläsarprompt för användarnamn och lösenord. Detta är skilt från Joomla-användarkonton. PHP tillämpar detta på Apache och Nginx så snart du sparar. Extra webbserverregler nedan stärker Apache via .htaccess och måste kopieras till Nginx. Kombinera det med anpassning av webbadressen till administratörens inloggningssida för två skyddslager. Vitlista besökarens IP som visas i platshållaren för det här fältet och i inloggningsrapporterna. Samma adress gäller för varje webbplats som öppnas från det här nätverket. Vitlista inte en privat proxyadress som 172.31.x.x."
