COM_JOOMSHIELD_STALE_URL_REWRITE_NOTE="Publika sidor kan fortfarande innehålla absoluta adresser från en tidigare domän eller en staging-kopia. JoomShield skriver om matchande URL:er i den HTML som skickas till besökare. Artiklar, menyer och annat lagrat innehåll ändras inte. Detta tillämpas i PHP på Apache och Nginx. Inga extra .htaccess- eller Nginx-serverregler krävs."
