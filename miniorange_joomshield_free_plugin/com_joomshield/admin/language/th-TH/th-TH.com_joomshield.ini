COM_JOOMSHIELD_NGINX_RULES_STEP_1="คัดลอกตัวอย่างด้านล่าง ซึ่งตรงกับการตั้งค่าปิดไซต์ฉุกเฉินและการป้องกันการเข้าถึงผู้ดูแลระบบในปัจจุบันแล้ว"
COM_JOOMSHIELD_NGINX_RULES_STEP_2="วางลงในบล็อก server { } ของการกำหนดค่า Nginx ของไซต์นี้ (มักเป็น /etc/nginx/sites-available/your-site หรือโฮสต์เสมือน Nginx ในแผงโฮสติ้ง)"
COM_JOOMSHIELD_NGINX_RULES_STEP_3="หากตัวอย่างมีบรรทัดยืนยันตัวตนผู้ดูแลระบบที่เป็นคอมเมนต์ ให้เพิ่มภายใน location ผู้ดูแลระบบที่มีอยู่ เพื่อให้การตั้งค่า PHP/FastCGI ไม่เปลี่ยน"
COM_JOOMSHIELD_NGINX_RULES_STEP_4="ทดสอบการตั้งค่า Nginx แล้วโหลด Nginx ใหม่ ทำขั้นตอนนี้ซ้ำหลังจากที่คุณเปิดหรือปิดฟีเจอร์จำกัด"
COM_JOOMSHIELD_NGINX_RULES_INCLUDE_NOTE="ทางเลือก: เพิ่มบรรทัด include ด้านล่างในบล็อก server { } เดียวกัน JoomShield จะซิงค์ไฟล์ที่สร้างไว้นั้นเมื่อคุณบันทึกการตั้งค่าการจำกัด คุณยังต้องโหลด Nginx ใหม่หลังการเปลี่ยนแปลงแต่ละครั้ง"
COM_JOOMSHIELD_NGINX_RULES_DISABLE_NOTE="หลังจากที่คุณปิดการปิดไซต์ฉุกเฉินหรือการป้องกันการเข้าถึงผู้ดูแลระบบ ให้แทนที่กฎ Nginx ของ JoomShield ที่วางไว้ก่อนหน้าด้วยตัวอย่างในหน้านี้ (หรือโหลด Nginx ใหม่หากคุณรวมไฟล์ที่สร้างไว้) หากยังคงบรรทัดเดิมในไฟล์ Nginx กฎเซิร์ฟเวอร์เหล่านั้นจะยังมีผล การป้องกัน PHP ยังคงทำงานไม่ว่ากรณีใด"
