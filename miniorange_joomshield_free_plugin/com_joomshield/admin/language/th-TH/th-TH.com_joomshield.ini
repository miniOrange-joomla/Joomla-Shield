COM_JOOMSHIELD_NGINX_RULES_INTRO="ใช้หน้านี้เมื่อไซต์ให้บริการโดย Nginx ไซต์ Apache และ LiteSpeed ไม่ต้องใช้หน้านี้ กฎจำกัดเพิ่มเติมจะถูกเขียนลง .htaccess โดยอัตโนมัติเมื่อเปิดตัวเลือกนั้น"
