COM_JOOMSHIELD_SERVER_RESTRICTION_NGINX_NOTE="Nginx ไม่ได้อ่าน .htaccess เปิดกฎ Nginx คัดลอกตัวอย่างปัจจุบัน วางลงในไฟล์ Nginx ที่ใช้กฎเซิร์ฟเวอร์กับไซต์นี้ จากนั้นโหลด Nginx ใหม่"
COM_JOOMSHIELD_SERVER_RESTRICTION_DISABLE_NOTE="หลังจากที่คุณปิดฟีเจอร์นี้ กฎ .htaccess ของ Apache จะอัปเดตโดยอัตโนมัติเมื่อเปิดตัวเลือกการเขียน Apache กฎ Nginx ต้องอัปเดตอีกครั้งจากแท็บกฎ Nginx ไม่เช่นนั้นข้อจำกัด Nginx เดิมจะยังคงมีผล"
COM_JOOMSHIELD_EMERGENCY_SITE_OFFLINE_APACHE_NOTE="เมื่อเปิดตัวเลือกการเขียน Apache แล้ว JoomShield จะเขียนบล็อก RewriteRule ที่มีเครื่องหมายลงใน .htaccess เพื่อให้ Apache ส่งกลับ 503 แก่ผู้เยี่ยมชมสาธารณะ URL ผู้ดูแลระบบและ IP ในรายการอนุญาตยังเข้าถึงได้ เมื่อคุณปิดฟีเจอร์นี้ บล็อก .htaccess ที่ทำเครื่องหมายไว้จะถูกลบโดยอัตโนมัติ"
COM_JOOMSHIELD_EMERGENCY_SITE_OFFLINE_NGINX_NOTE="คัดลอกกฎปิดไซต์ฉุกเฉินจากแท็บกฎ Nginx ไปยังบล็อก server { } ของไซต์นี้ จากนั้นโหลด Nginx ใหม่ PHP ยังคงทำให้ไซต์ออฟไลน์แม้ว่าจะไม่ได้เพิ่มบรรทัด Nginx เหล่านั้น"
COM_JOOMSHIELD_EMERGENCY_SITE_OFFLINE_DISABLE_NOTE="หลังจากที่คุณปิดการปิดไซต์ฉุกเฉิน ไฟล์ .htaccess ของ Apache จะอัปเดตโดยอัตโนมัติเมื่อเปิดตัวเลือกการเขียน Apache สำหรับ Nginx ให้เปิดกฎ Nginx แล้วแทนที่บรรทัด JoomShield ที่วางไว้ก่อนหน้าด้วยตัวอย่างใหม่ (หรือโหลด Nginx ใหม่หากคุณรวมไฟล์ที่สร้างไว้) หากยังคงบรรทัด Nginx เดิมไว้ ไซต์อาจยังถูกบล็อกที่เซิร์ฟเวอร์"
COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_APACHE_NOTE="เมื่อเปิดตัวเลือกการเขียน Apache แล้ว JoomShield จะเขียน HTTP Basic Auth และการส่งต่อ Authorization ลงในไฟล์ .htaccess ของไซต์ บันทึกรหัสผ่านการป้องกันก่อนเพื่อให้สามารถสร้างไฟล์รหัสผ่านของ Apache ได้"
COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_NGINX_NOTE="PHP ยังคงแสดงพรอมต์ที่ /administrator สำหรับพรอมต์ Nginx เพิ่มเติม ให้คัดลอกบรรทัด auth ที่เป็นคอมเมนต์จากแท็บกฎ Nginx ไปยัง location ของผู้ดูแลระบบที่มีอยู่ เพื่อให้การตั้งค่า PHP/FastCGI ไม่เปลี่ยน และส่งต่อส่วนหัว Authorization: fastcgi_param HTTP_AUTHORIZATION $http_authorization;"
COM_JOOMSHIELD_ADMINISTRATOR_ACCESS_PROTECTION_DISABLE_NOTE="หลังจากที่คุณปิดการป้องกันการเข้าถึงผู้ดูแลระบบ ไฟล์ .htaccess ของ Apache จะอัปเดตโดยอัตโนมัติเมื่อเปิดตัวเลือกการเขียน Apache สำหรับ Nginx ให้ลบหรือแทนที่บรรทัด auth ของ JoomShield ที่วางไว้ก่อนหน้าจากแท็บกฎ Nginx แล้วโหลด Nginx ใหม่ ไม่เช่นนั้น Nginx อาจยังคงขอรหัสผ่านเพิ่มเติม"
COM_JOOMSHIELD_SERVER_RULES_SAVED_NOTE="การป้องกัน PHP ทำงานบน Apache และ Nginx Apache / LiteSpeed: กฎเพิ่มเติมถูกเขียนลง .htaccess หากเปิดตัวเลือกนั้น Nginx: เปิดแท็บกฎ Nginx คัดลอกตัวอย่างปัจจุบันไปยังไฟล์ Nginx ที่ใช้กฎเซิร์ฟเวอร์กับไซต์นี้ จากนั้นโหลด Nginx ใหม่ หลังจากปิดฟีเจอร์จำกัด ให้อัปเดตกฎ Nginx อีกครั้ง"
COM_JOOMSHIELD_OPEN_NGINX_RULES="เปิดกฎ Nginx"
COM_JOOMSHIELD_SERVER_RULES_STATUS_TITLE="การตั้งค่าการจำกัดปัจจุบันที่ใช้สร้างกฎ Nginx เหล่านี้"
COM_JOOMSHIELD_SERVER_RULES_STATUS_ON="เปิด"
